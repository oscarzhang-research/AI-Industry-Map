title: "Alphabet: An Accelerating Cash Machine Places a Historic Capex Bet"
titleZh: "Alphabet (GOOG) 深度初研"
subtitle: "The question is no longer whether Google is a great business, but what roughly $200B a year of investment will earn."
date: 2026-09-24
asOf: 2026-09-23
reportType: initiation
languages: [zh, en]

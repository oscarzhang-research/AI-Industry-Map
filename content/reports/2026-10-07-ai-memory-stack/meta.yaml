title: "The Memory Wall: AI Has Turned Every Storage Tier into a Bottleneck"
titleZh: "AI 存储全栈图谱"
subtitle: "A nine-tier map of AI data-center memory, from SRAM to tape: what each tier does, where training, inference and agents bind, and who captures value."
date: 2026-10-07
asOf: 2026-10-07
reportType: industry
languages: [zh, en]
companies: [sk-hynix, samsung-electronics, micron, nvidia, sandisk, kioxia, cxmt, ymtc, tsmc, deepseek, alphabet, seagate]
nodes: [chips/memory, chips/memory/dram-hbm, chips/memory/nand-ssd, chips/memory/hdd]

title: "Micron FQ4 FY26: The Shortage Runs Into 2028 as the Price Curve Flattens"
titleZh: "美光 FQ4 FY26 深度研报"
subtitle: "Every line beat and SCAs rose to 26 with ~$150B of RPO, but price increases are slowing and a 2028 supply wall is being poured."
date: 2026-10-01
asOf: 2026-09-30
reportType: earnings
languages: [zh, en]
companies: [micron, sk-hynix, samsung-electronics, nvidia, cxmt, ymtc, sandisk, nanya, kioxia, seagate]

title: "Alphabet: Google's AI Stack Is Deepest at Both Ends, Most Exposed in the Middle"
titleZh: "Alphabet 深度研究（二）：全栈AI、搜索广告、Gemini与谷歌云"
subtitle: "How the stack closes the loop, whether search ads survive AI, why Gemini fell behind, and how Google Cloud compares with AWS and Azure."
date: 2026-09-24
asOf: 2026-09-23
reportType: deep-dive
languages: [zh, en]
companies: [alphabet, openai, anthropic, amazon, microsoft, apple, nvidia, meta, broadcom]

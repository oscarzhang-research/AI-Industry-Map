# Feeds read by .github/workflows/news-feed.yml (scripts/news/fetch_feeds.py). Every two hours GitHub
# Actions fetches them, keeps entries from the last four days, tags each entry with company ids and
# layers, and publishes news-candidates.json to the "feeds" branch. A morning Claude routine reads that
# file to pick and verify items for content/news/. Nothing here is shown on the site.
#
#   id         unique slug (lower case, digits, hyphens)
#   name       copied to each item as sourceName
#   kind       company | regulator | filing | media
#   url        RSS 2.0 or Atom feed. SEC EDGAR company feeds accept a ticker as CIK.
#   companies  optional: always tag these company ids (they must exist in content/companies)
#   excerpt    true keeps the opening text of the linked page (primary sources only; never for media).
#              For SEC filings the text comes from the EX-99.1 press-release exhibit.
#
# Media entries are kept only when they mention a company or a layer keyword; every company, regulator
# and filing entry inside the window is kept. A trailing "# verify" marks a feed URL that has not been
# confirmed: after a run, check sources-status.json on the feeds branch and fix or drop sources that
# keep failing.

# How feed text is matched to companies, on top of each company's name and aliases in content/companies.
# Short names (4 characters or fewer) always match case-sensitively; bare tickers only count inside
# exchange patterns such as "(NASDAQ: NVDA)" or "$NVDA".
match:
  # Short names the press uses that the company records do not list. Matched exactly as written.
  extra:
    meta: [Meta, Llama]
    microsoft: [Copilot]
    amazon: [AWS]
    oracle: [OCI]
    arista: [Arista]
    hpe: [HPE]
    hp: [HP]
    constellation: [Constellation]
    nextera: [NextEra]
    talen: [Talen]
    centrus: [Centrus]
    dominion: [Dominion]
    aep: [AEP]
    nrg: [NRG]
    bwx-technologies: [BWXT]
    mitsubishi-heavy: [Mitsubishi Heavy, MHI]
    lg-energy-solution: [LGES]
  # Names or aliases that never tag a company on their own: ordinary words, places or other brands.
  # Longer forms still match ("Scale AI", "Palo Alto Networks", "Galaxy Digital").
  ignore: [Carrier, Chinese Online, Command, Figure, Fireworks, Galaxy, Inkling, Lam, Marble,
           Network Appliance, North, Nova, Outlier, Palo Alto, SCREEN, Scale, Sohu, Spark, Step, Surge,
           Talkie, Tinker, Together]
  # Names that are also ordinary words or phrases: they match only with this capitalisation.
  exactCase: [Alphabet, Applied Digital, Applied Materials, Cadence, Cognition, Cohere, Coherent,
              Confluence, Core Scientific, Credo, Cursor, Disco, Elastic, Etched, Expand Energy,
              First Solar, Fluence, Hugging Face, Intuit, Lambda, Micron, Moonshot, Now Assist,
              Perplexity, Physical Intelligence, Pure Storage, Recursion, Runway,
              Safe Superintelligence, Snowflake, Thinking Machines, Ultra Clean, Workday, World Labs]


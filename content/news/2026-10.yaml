    summary: "Anthropic petitioned the D.C. Circuit for a rehearing after a three-judge panel ruled 2-1 in September that the Defense Department could keep it designated a supply-chain risk. The company argues the panel ignored evidence that the designation was retaliation for its statements on AI safety."

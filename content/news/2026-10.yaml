    summary: "TrendForce expects combined capital spending by the nine largest cloud providers to rise 106% to $957 billion in 2026 and about 60% more to over $1.5 trillion in 2027, both revised up. It forecasts AI server revenue growing more than 90% on higher shipments and prices."

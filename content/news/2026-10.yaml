    date: 2026-10-06
    title: "Lambda raising up to $4 billion at $14.5 billion pre-money ahead of 2027 IPO"
    summary: "GPU cloud Lambda is raising up to $4 billion in a round led by Blackstone and Coatue at a $14.5 billion pre-money valuation, The Wall Street Journal reported. Its backlog grew from $15 billion in June to $50 billion in September, mostly from an Anthropic commitment."
    source: { name: "TechCrunch", url: "https://techcrunch.com/2026/10/06/ai-computing-startup-lambda-to-raise-4b-ahead-of-planned-ipo/" }

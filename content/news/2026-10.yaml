    date: 2026-10-14
    title: "LS Electric wins a $138.5 million Bloom Energy order for a Pennsylvania data center"
    summary: "LS Electric will supply 38kV switchgear and distribution transformers worth 185.3 billion won (about $138.5 million) for Bloom Energy fuel cells at a Pennsylvania data center, with deliveries from April to July 2027. It is the second such deal after a $216.5 million order in April."
    source: { name: "DCD", url: "https://www.datacenterdynamics.com/en/news/ls-electric-secures-138m-order-to-supply-switchgear-for-bloom-fuel-cells-at-pennsylvania-data-center/" }

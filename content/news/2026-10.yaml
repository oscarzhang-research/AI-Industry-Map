    title: "Eight US states sue OpenAI over ChatGPT's safety for minors"
    summary: "Iowa, Kansas, Nebraska, West Virginia, Arkansas, Arizona, Idaho and Montana each sued OpenAI in state court, alleging ChatGPT is a dangerous product that has harmed children and misled parents. OpenAI pointed to its age-specific protections and parental controls."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/14/openai-sued-by-8-states-over-chatgpt-safety-concerns-.html" }

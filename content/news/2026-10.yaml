    summary: "Anthropic told prospective investors that third-quarter revenue reached $16.8 billion, up from about $11.6 billion in the second quarter, and that it was profitable on an adjusted basis, CNBC and Bloomberg reported, citing people familiar with the matter. The IPO is reportedly slated for November."

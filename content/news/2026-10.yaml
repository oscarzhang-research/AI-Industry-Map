  - id: 2026-10-30-doosan-nuscale-upper-reactor-vessel
    date: 2026-10-30
    title: "Doosan Enerbility will build the upper reactor vessel for NuScale's SMR"
    summary: "NuScale contracted Doosan Enerbility to manufacture the upper section of the reactor pressure vessel for its small modular reactor at Doosan's Changwon plant. The deal moves the partners from preparing materials to making reactor components for commercial deployment."
    source: { name: "World Nuclear News", url: "https://www.world-nuclear-news.org/articles/doosan-to-manufacture-upper-reactor-vessel-for-nuscale-smr" }
    companies: [doosan-enerbility, nuscale]
    nodes: [energy/generation-equipment/nuclear-smr]
    themes: [nuclear]
    impact: positive
    importance: 1

  - id: 2026-10-30-doe-grid-supply-chain-funding
    date: 2026-10-30
    title: "DOE opens $237 million in funding for US grid equipment supply chains"
    summary: "The Energy Department opened its first Grid Supply Chain Program funding round, with up to $187 million for US-made alternative materials and subcomponents and up to $50 million for refurbishing and reusing grid equipment. Concept papers are due November 20, 2026."
    source: { name: "US Department of Energy", url: "https://www.energy.gov/articles/energy-department-announces-over-230-million-funding-opportunity-strengthen-americas-grid" }
    companies: []
    nodes: [energy/grid/transformers]
    themes: [power-bottleneck]
    impact: positive
    importance: 1

  - id: 2026-10-30-centrus-first-centrifuge-piketon
    date: 2026-10-30
    title: "Centrus ships the first centrifuge for its Piketon enrichment expansion"
    summary: "Centrus shipped the first new centrifuge from its Oak Ridge, Tennessee, plant for the expansion of its Piketon, Ohio, enrichment site, backed by a $900 million DOE task order that includes HALEU production. The new centrifuges are expected to start operating in Ohio in 2029."
    source: { name: "World Nuclear News", url: "https://www.world-nuclear-news.org/articles/centrus-ships-first-centrifuge-for-piketon-plant-expansion" }
    companies: [centrus]
    nodes: [energy/fuel/enrichment-fuel]
    themes: [nuclear]
    impact: positive
    importance: 1

  - id: 2026-10-30-intel-fab-28-explosion-600-million
    date: 2026-10-30
    title: "Intel expects about $600 million revenue hit from the Fab 28 explosion"
    summary: "Intel said the explosion at its Kiryat Gat fab shut the plant for about two weeks and will cut about $300 million from fourth-quarter revenue, with a similar hit expected in the first quarter of 2027, mostly in 10nm server processors. It also expects about two points off fourth-quarter non-GAAP gross margin."
    source: { name: "DCD", url: "https://www.datacenterdynamics.com/en/news/intel-says-israel-fab-explosion-will-cost-company-600m-in-losses-as-q3-26-revenue-hits-165bn/" }
    companies: [intel]
    nodes: [chips/compute/server-cpus]
    impact: negative
    importance: 2

  - id: 2026-10-30-google-suncatcher-first-response
    date: 2026-10-30
    title: "Google's Suncatcher satellite returns its first AI output from a TPU in orbit"
    summary: "Google said its Project Suncatcher prototype satellite, launched on October 1, ran the open Gemma model on a TPU in orbit and sent back its first response. Google plans thermal and radiation tests next and aims to fly a pair of linked satellites in 2027."
    source: { name: "Google", url: "https://blog.google/innovation-and-ai/models-and-research/google-research/project-suncatcher-satellite-response/" }
    companies: [alphabet]
    nodes: [chips/compute/hyperscaler-silicon]
    themes: [data-centers]
    impact: neutral
    importance: 1

  - id: 2026-10-30-foxconn-targets-half-of-ai-server-market
    date: 2026-10-30
    title: "Foxconn aims for half of the global AI server market within two years"
    summary: "Foxconn chairman Young Liu told CNBC the company holds about 40% of the global AI server market and could reach around 45% next year and 50% in a couple of years. He said capacity is fully booked for at least 18 months."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/30/hon-hai-technology-group-foxconn-ai-server-young-liu-.html" }
    companies: [hon-hai]

  - id: 2026-10-02-broadcom-anthropic-60-billion-financing
    date: 2026-10-02
    title: "Blackstone and banks assemble $60 billion to fund Broadcom chips for Anthropic"
    summary: "Bloomberg reported that banks and Blackstone are assembling about $60 billion of debt, in a $42 billion senior tranche and an $18 billion Blackstone-led junior tranche, to finance AI chips leased to Anthropic, with Broadcom providing residual value support."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-02/broadcom-starts-amassing-60-billion-to-fund-chips-for-anthropic" }
    companies: [broadcom, anthropic]

    date: 2026-10-07
    title: "CoreWeave enters India with AdaniConneX, planning 240 MW in Navi Mumbai"
    summary: "CoreWeave announced its first India data centers through a deal with AdaniConneX, planning 240 megawatts of capacity in Navi Mumbai."
    source: { name: "CoreWeave", url: "https://investors.coreweave.com/news/news-details/2026/CoreWeave-Enters-India-Expanding-AI-Cloud-Platform-With-AdaniConneX/default.aspx" }

  - id: 2026-10-14-globalfoundries-new-york-fabs
    date: 2026-10-14
    title: "GlobalFoundries to run two new New York fabs funded under a US-Japan deal of up to $21 billion"
    summary: "GlobalFoundries was selected to operate two new 300mm fabs at its Malta, New York site, funded by Japan under a US-Japan initiative of up to $21 billion. The first fab, with about $10 billion, is due online in 2029, and both together would add around 900,000 wafers of annual capacity."
    source: { name: "GlobalFoundries", url: "https://gf.com/news-and-events/news/globalfoundries-selected-to-operate-two-new-semiconductor-fabs-in-new-york-under-landmark-us-japan-initiative/" }
    companies: [globalfoundries]
    nodes: [chips/foundry-packaging/mature-foundry]
    impact: positive
    importance: 2

  - id: 2026-10-14-aep-google-702mw-fuel-cells
    date: 2026-10-14
    title: "AEP to build a 702 MW Bloom fuel cell plant in Wyoming to power Google"
    summary: "AEP plans to invest about $4 billion in a 702 MW fuel cell facility near Cheyenne, Wyoming, selling its output to Google under a 20-year power purchase agreement. Bloom Energy will supply the fuel cells, and the plant is expected to be fully running by the end of 2028."
    source: { name: "AEP", url: "https://www.aep.com/news/stories/view/12314/" }
    companies: [aep, bloom-energy, alphabet]
    nodes: [energy/generation-equipment/fuel-cells]

  - id: 2026-10-02-oracle-point-beach-nuclear-subscription
    date: 2026-10-02
    title: "Oracle to take 10–20% of Point Beach nuclear output for AI campus"
    summary: "We Energies agreed to let Oracle subscribe to 10–20% of the output of the NextEra-owned Point Beach nuclear plant for the Port Washington, Wisconsin campus Oracle is developing with OpenAI. The utility says the deal could save other customers about $300 million in fuel costs over five years; it still needs state approval."
    source: { name: "Wisconsin Watch", url: "https://wisconsinwatch.org/2026/10/wisconsin-we-energies-deal-oracle-data-center-nuclear-energy-power-point-beach-plant/" }
    companies: [oracle, nextera]

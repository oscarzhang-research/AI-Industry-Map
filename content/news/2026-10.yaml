  - id: 2026-10-30-reddit-worst-day-on-record
    date: 2026-10-30
    title: "Reddit shares fall 29% after a weak fourth-quarter forecast"
    summary: "Reddit fell about 29% on October 30, its worst day since its 2024 listing, after guiding fourth-quarter sales to $1.00 billion to $1.03 billion against a $1.05 billion estimate. It also plans to test requiring users to log in, as AI search answers cut referral traffic from Google."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/30/reddit-stock-q3-earnings.html" }
    companies: [reddit, alphabet]
    nodes: [applications/ads-commerce-content/ads-recsys]
    impact: negative
    importance: 2

  - id: 2026-10-30-waymo-toyota-bz4x-robotaxi
    date: 2026-10-30
    title: "Waymo picks the Toyota bZ4X as its next robotaxi, starting in Japan in 2027"
    summary: "Toyota will build an autonomous bZ4X for Waymo at its Takaoka plant, integrating Waymo's hardware on the same line. Testing and validation of the fleet starts in Japan in 2027, with the UK and other Waymo markets to follow."
    source: { name: "Waymo", url: "https://waymo.com/blog/2026/10/toyota-bz4x-partnership/" }
    companies: [waymo]
    nodes: [applications/physical-ai/autonomous-driving]
    themes: [robotics]

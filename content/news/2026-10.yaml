    summary: "Updated network access permits from China's industry ministry for the iPhone Duo, iPhone 18 Pro and several earlier models list Apple Intelligence plus Alibaba's Qwen and Wanxiang models as approved AI systems. Apple has not yet launched Apple Intelligence on the Chinese mainland."
    source: { name: "South China Morning Post", url: "https://www.scmp.com/tech/big-tech/article/3370893/china-approves-alibaba-ai-models-use-iphone-duo-and-other-apple-handsets" }

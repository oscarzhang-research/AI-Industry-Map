    title: "Nanya's DRAM prices seen rising about 10% in fourth quarter"
    summary: "Nanya Technology's DRAM average selling price is expected to rise about 10% in the fourth quarter, TrendForce reported, with the company able to meet only around 50–60% of customer demand, according to cited investor estimates."
    source: { name: "TrendForce", url: "https://www.trendforce.com/news/2026/10/06/news-nanya-dram-asp-seen-rising-10-in-4q26-winbond-also-sees-further-price-gains-as-memory-supply-stays-tight/" }

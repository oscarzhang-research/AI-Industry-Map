  - id: 2026-10-30-china-optical-suppliers-extend-selloff
    date: 2026-10-30
    title: "Chinese optical module makers extend sell-off despite strong earnings"
    summary: "Eoptolink fell as much as 15% in Shenzhen on October 30 after an 11.1% drop the day before, and Innolight fell 8.5% on October 29, the South China Morning Post reported. Investors focused on weaker quarter-on-quarter profit, including a roughly 19% sequential fall at Eoptolink, while both companies said demand for 1.6T modules remains strong."
    source: { name: "South China Morning Post", url: "https://www.scmp.com/tech/tech-trends/article/3372672/chinas-optical-suppliers-extend-sell-fears-slower-ai-growth-trump-upbeat-earnings" }

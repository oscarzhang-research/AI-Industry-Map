    summary: "Google released its Gemini 4 Argon frontier model to developers through the paid Gemini API, to Google AI Pro and Ultra subscribers in the Gemini app, and to Google Cloud customers. Introductory API pricing is $2 per million input tokens and $10 per million output tokens through November 30, then $4 and $20."

    summary: "ServiceNow shares fell 27% on October 29 after third-quarter revenue of $4.11 billion only matched the $4.10 billion estimate, reviving concern that AI will erode enterprise software. The company slightly raised its 2026 subscription revenue outlook to $15.78 billion to $15.79 billion and said net new AI contract value rose 65%."

    nodes: [infrastructure/networking/optical-transceivers]
    themes: [optical, china-ai]
    impact: negative
    importance: 2

  - id: 2026-10-29-amazon-q3-2026-results
    date: 2026-10-29
    title: "Amazon misses on sales and EPS as AWS growth reaches 39%"
    summary: "Amazon reported third-quarter net sales of $201.9 billion, up 12% and just below the $202.3 billion consensus, and EPS of $1.89 against $1.96 expected. AWS sales rose 39% to $46.0 billion with $17.8 billion of operating income; Amazon guided fourth-quarter sales to $240 billion to $247 billion and kept 2026 capex at about $220 billion."
    source: { name: "Amazon", url: "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Third-Quarter-Results/default.aspx" }

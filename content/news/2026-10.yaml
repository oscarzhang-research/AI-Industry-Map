    summary: "Alphabet shares dropped about 13% on October 29, the largest one-day fall since Google's 2004 listing, erasing roughly $500 billion of market value. Investors reacted to search revenue of $63.35 billion against a $64.96 billion estimate and third-quarter free cash flow of minus $9.07 billion."

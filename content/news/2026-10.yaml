    summary: "Mistral published the weights of Mistral Large 4, a multimodal mixture-of-experts model with 1.05 trillion total and 52 billion active parameters, under its Ecosystem Open-Weight license. Companies offering it as a hosted service need a separate commercial license, and Mistral is pitching the model for defensive cybersecurity work."

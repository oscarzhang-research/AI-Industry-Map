items:
  - id: 2026-10-09-omdia-pc-shipments-fall-21-percent
    date: 2026-10-09
    title: "Global PC shipments fall 21% in the third quarter, Omdia says"
    summary: "Omdia estimates worldwide desktop, notebook and workstation shipments fell 21.2% from a year earlier to 58.1 million units in the third quarter of 2026. It blamed demand pulled into earlier quarters and rising component costs."
    source: { name: "Omdia", url: "https://omdia.tech.informa.com/pr/2026/oct/global-pc-shipments-fall-21percent-in-3q26-as-pull-forward-demand-subsides" }
    companies: [lenovo, hp, dell]
    nodes: [applications/devices/phones-pcs]
    themes: [memory-cycle]
    impact: negative
    importance: 2

  - id: 2026-10-09-firmus-withdraws-ipo
    date: 2026-10-09
    title: "Nvidia-backed data center operator Firmus pulls its Australian IPO"
    summary: "Firmus withdrew its planned listing, citing market volatility, after its board concluded the offer terms undervalued the company. The shares had been marketed at A$11, and Firmus said it will seek capital from private markets instead."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/09/nvidia-ai-firmus-ipo-.html" }
    companies: [nvidia]
    nodes: [infrastructure/data-centers/ai-campuses]
    themes: [capex, data-centers]
    impact: negative
    importance: 2

  - id: 2026-10-09-softbank-seeks-100-billion-gulf
    date: 2026-10-09
    title: "SoftBank seeks up to $100 billion from Gulf investors for AI, FT reports"
    summary: "SoftBank is looking to raise as much as $100 billion from Gulf investors to expand its AI bets, the Financial Times reported, with Masayoshi Son in early talks with backers including in the UAE. The fund would buy companies and deploy AI and robots, including from SoftBank's robotics unit Roze, in their operations."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-09/softbank-seeks-100-billion-from-gulf-investors-for-ai-ft-says" }
    companies: [softbank]
    nodes: [models/frontier-labs/listed-exposure]
    themes: [capex, robotics]
    impact: mixed
    importance: 2

  - id: 2026-10-09-openai-defends-researcher-firings
    date: 2026-10-09
    title: "OpenAI says it fired three safety researchers over sensitive information"
    summary: "OpenAI said it dismissed three safety researchers after an investigation found they broke its policies on handling sensitive information, and that the decision was not about their safety concerns. The researchers had posted a letter to the board and safety committees on X the day before."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/09/openai-fired-researchers-ai-concerns.html" }
    companies: [openai]
    nodes: [models/frontier-labs/closed-frontier]
    impact: negative
    importance: 1

  - id: 2026-10-09-lumentum-sold-out-through-2029
    date: 2026-10-09
    title: "Lumentum says its AI optical parts are sold out through almost 2029"
    summary: "Lumentum CEO Michael Hurlston told Bloomberg that the company's optical components for AI data centers are effectively sold out through nearly 2029, about a year beyond the 2028 horizon he gave in April. The shares rose as much as about 6% after the interview."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-09/nvidia-backed-lumentum-sees-opto-parts-capacity-sold-out-to-2029" }
    companies: [lumentum]
    nodes: [infrastructure/networking/optical-components]
    themes: [optical]
    impact: positive
    importance: 2

  - id: 2026-10-08-openai-revenue-run-rate-ai-selloff
    date: 2026-10-08
    title: "AI stocks slide after OpenAI puts annualized revenue near $50 billion"
    summary: "OpenAI told investors it reached roughly $50 billion in annualized revenue at the end of September, below the $68 billion figure widely reported earlier, which a person familiar said included partners' gross revenue. Oracle fell nearly 6%, CoreWeave nearly 8% and Nvidia 3% on the day."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/08/open-ai-revenue-nvidia-oracle-coreweave.html" }
    companies: [openai, oracle, coreweave, nvidia]
    nodes: [models/frontier-labs/closed-frontier, infrastructure/cloud/neoclouds]
    themes: [capex]
    impact: negative
    importance: 3

  - id: 2026-10-08-samsung-q3-preliminary-record-profit
    date: 2026-10-08
    title: "Samsung guides record third-quarter operating profit of 107.4 trillion won"
    summary: "Samsung Electronics estimated third-quarter operating profit at about 107.4 trillion won, up 782.5% from a year earlier, on sales of roughly 195 trillion won, with analysts crediting memory for most of the profit. Full results are due October 29."
    source: { name: "Samsung Newsroom", url: "https://news.samsung.com/global/samsung-electronics-announces-earnings-guidance-for-third-quarter-2026" }
    companies: [samsung-electronics]
    nodes: [chips/memory/dram-hbm]
    themes: [memory-cycle, hbm]
    impact: positive
    importance: 3

  - id: 2026-10-08-tsmc-september-revenue
    date: 2026-10-08
    title: "TSMC September revenue rises 54.6% as third quarter hits a record"
    summary: "TSMC's September revenue was NT$511.86 billion, up 54.6% from a year earlier and down 0.6% from August's record. Third-quarter revenue reached a record of about NT$1.494 trillion."
    source: { name: "TSMC", url: "https://pr.tsmc.com/english/news/3343" }
    companies: [tsmc]
    nodes: [chips/foundry-packaging/leading-edge]
    impact: positive
    importance: 2

  - id: 2026-10-08-palantir-goldman-upgrade
    date: 2026-10-08
    title: "Palantir gains 2% on Goldman Sachs upgrade as AI stocks fall"
    summary: "Palantir rose 2% on October 8 after Goldman Sachs upgraded the stock, saying the company isn't done capitalizing on the AI boom, making it one of the few AI-linked names to close higher that day."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/08/palantir-isnt-done-capitalizing-on-ai-boom-goldman-sachs-says.html" }
    companies: [palantir]
    nodes: [applications/enterprise/data-platforms]
    impact: positive
    importance: 1

  - id: 2026-10-08-nvidia-1-billion-us-science
    date: 2026-10-08
    title: "Nvidia commits $1 billion over five years to US science research"
    summary: "Nvidia announced commitments valued at $1 billion over five years to build US capacity for superintelligence research, including quantum computing, healthcare and energy security, funding universities, quantum initiatives and cloud providers serving government research."
    source: { name: "NVIDIA", url: "https://nvidianews.nvidia.com/news/nvidia-commits-1-billion-to-advance-us-science-over-the-next-five-years" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    themes: [sovereign-ai]

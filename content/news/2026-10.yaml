    date: 2026-10-07
    title: "Applied Digital's quarterly revenue rises 322% to $341.9 million"
    summary: "Applied Digital's revenue for the quarter ended August 31 rose 322% from a year earlier to $341.9 million, and adjusted EBITDA reached $64.4 million against $0.5 million. The company put contracted revenue from its AI data-center leases at about $36 billion."
    source: { name: "Applied Digital (SEC 8-K)", url: "https://www.sec.gov/Archives/edgar/data/0001144879/000114487926000057/apldq127earningsrelease.htm" }

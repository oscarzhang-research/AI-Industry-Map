  - id: 2026-10-07-broadcom-openai-chip-financing
    date: 2026-10-07
    title: "Broadcom reportedly arranging about $50 billion to finance OpenAI's custom chips"
    summary: "Broadcom is in early talks to arrange about $50 billion of financing to help OpenAI buy the custom AI chips the two are co-developing, the Wall Street Journal reported; another report put the debt at around $30 billion, and no formal process had begun."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-07/broadcom-plans-50-billion-financing-for-openai-chips-wsj-says" }

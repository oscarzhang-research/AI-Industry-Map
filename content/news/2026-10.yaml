  - id: 2026-10-30-anthropic-junk-rating-expected
    date: 2026-10-30
    title: "Blackstone expects Anthropic to get a high junk credit rating, FT reports"
    summary: "Blackstone, anchor investor in a $63 billion deal financing Anthropic's chips, told investors it now expects Anthropic to receive a high junk rating after its IPO, reversing an earlier forecast of investment grade, the Financial Times reported. Anthropic and Blackstone declined to comment."
    source: { name: "TechCrunch", url: "https://techcrunch.com/2026/10/30/anthropic-expected-to-receive-high-junk-rating-from-credit-agencies-following-ipo-report-says/" }
    companies: [anthropic]
    nodes: [models/frontier-labs/closed-frontier]

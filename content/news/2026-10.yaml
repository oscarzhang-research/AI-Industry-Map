    title: "Sandisk revenue rises 23% sequentially to $11.0 billion on data center demand"
    summary: "Sandisk reported fiscal first-quarter revenue of $11.0 billion, above the $10.7 billion consensus, and non-GAAP EPS of $49.51 against $46.41 expected, with an 85.1% non-GAAP gross margin. It guided fiscal second-quarter revenue to $12.2 billion to $12.6 billion and non-GAAP EPS to $55.00 to $57.00 before its pending stock split."

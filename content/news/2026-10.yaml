    date: 2026-10-05
    title: "LG Electronics signs a long-term chiller supply deal for 5 GW of AI data centers"
    summary: "LG Electronics USA agreed to supply chillers and other cooling equipment in phases to AIR Control Concepts for AI data centers in the US and Canada totaling about 5 GW. LG said the deal gives it a steadier pipeline than bidding project by project."
    source: { name: "LG Electronics", url: "https://www.lg.com/global/newsroom/news/eco-solution/lg-electronics-secures-supply-agreement-to-advance-ai-data-center-cooling-business-in-north-america/" }

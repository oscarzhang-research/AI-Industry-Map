    date: 2026-10-14
    title: "Dell falls 11% after Barclays downgrades it, HPE and NetApp on enterprise AI timing"
    summary: "Barclays cut Dell, HPE and NetApp to hold, arguing that only about a quarter of enterprise AI spending goes to hardware and that recent revenue gains largely reflect higher memory prices. Dell fell about 11% on October 14 and the Nasdaq closed down 1.9%."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/14/dell-stock-barclays-enterprise-ai.html" }

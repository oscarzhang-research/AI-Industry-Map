    importance: 2

  - id: 2026-10-30-sp-meta-outlook-negative
    date: 2026-10-30
    title: "S&P moves Meta's credit outlook to negative on capex and cash flow"
    summary: "S&P Global Ratings kept Meta at AA- but cut its outlook to negative from stable, citing uncertainty about elevated capex and negative free cash flow. Meta guided 2026 capex to $135 billion to $145 billion and reported third-quarter free cash flow of minus $2.12 billion."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/10/30/meta-outlook-to-revised-to-negative-by-sp-after-cash-flow-negative.html" }
    companies: [meta]

    title: "FERC lets PJM build a data center database but rejects its curtailment plan"
    summary: "FERC approved PJM's request to collect site-level data on data centers, including in-service dates, load ramp-up and backup generation. It rejected PJM's proposal to cut grid power to data centers during peak stress, saying a revised plan would need to explain why data centers rather than other large users would be curtailed."

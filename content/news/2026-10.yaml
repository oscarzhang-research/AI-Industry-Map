  - id: 2026-10-07-finland-halts-google-data-center-sites
    date: 2026-10-07
    title: "Finland orders Google to pause work at two data-center sites"
    summary: "Finland's Licensing and Supervision Agency told Google's local unit to stop site preparation at its planned Muhos and Kajaani data centers by October 23 until environmental impact assessments are complete. About 330 hectares of forest had been cleared at Muhos and nearly 200 at Kajaani."
    source: { name: "Al Jazeera", url: "https://www.aljazeera.com/news/2026/10/7/finland-orders-halt-to-work-on-google-data-sites-over-environment-concerns" }
    companies: [alphabet]
    nodes: [infrastructure/cloud/hyperscalers]
    themes: [data-centers]
    impact: negative
    importance: 1

  - id: 2026-10-06-google-constellation-nuclear-deal
    date: 2026-10-06
    title: "Google signs 3.6 GW nuclear deal with Constellation, including 890 MW uprates"
    summary: "Google agreed to a 20-year PPA for 890 MW of new capacity from uprates at 11 Constellation reactors in Illinois, Pennsylvania and New Jersey, backed by more than $4.3 billion of investment, plus a 15-year contract for 2,700 MW of existing PJM output. The first uprate is due online by 2028."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-06/google-constellation-near-billion-dollar-deal-for-nuclear-power" }
    companies: [constellation, alphabet]
    nodes: [energy/power-producers/ipps]
    themes: [nuclear, power-bottleneck, data-centers]
    impact: positive
    importance: 3


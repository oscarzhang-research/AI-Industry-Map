    date: 2026-10-07
    title: "Musk says Grok Bot will route tasks to Claude Opus 5.5, Midjourney, Suno"
    summary: "Elon Musk said Grok Bot will send each task to the strongest available model, naming Anthropic's Claude Opus 5.5 for text and reasoning, Midjourney for images and Suno for music."
    source: { name: "The Next Web", url: "https://thenextweb.com/news/grok-bot-claude-opus-midjourney-suno-musk" }
    companies: [xai, anthropic]
    nodes: [applications/assistants/chat-assistants, models/frontier-labs/closed-frontier]

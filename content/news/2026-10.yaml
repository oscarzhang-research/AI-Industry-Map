    title: "CoreWeave drops 15.5% as yields on its bonds near 15%"
    summary: "CoreWeave shares fell 15.5% on October 14 as yields on its 2031 and 2032 bonds rose to about 14.8% to 14.9% on concern about AI borrowing. The CEO said in a memo that its backlog supports all of its debt obligations; Nebius and Iren fell as much as 10%."

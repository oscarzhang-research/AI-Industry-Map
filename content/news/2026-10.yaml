  - id: 2026-10-05-hon-hai-september-sales-record
    date: 2026-10-05
    title: "Hon Hai's September sales top NT$1 trillion for first time"
    summary: "Hon Hai reported record September revenue of about NT$1.15 trillion, up 38.4% from a year earlier and 25.7% from August, led by its cloud and networking products unit, which includes AI servers. Third-quarter revenue rose 47% to about NT$3.03 trillion."
    source: { name: "Focus Taiwan (CNA)", url: "https://focustaiwan.tw/business/202610050019" }
    companies: [hon-hai]
    nodes: [infrastructure/servers/odm]
    impact: positive
    importance: 2

  - id: 2026-10-02-toshiba-hdd-expansion-seagate-wd-slide
    date: 2026-10-02
    title: "Seagate and Western Digital slide as Toshiba plans to double HDD output"
    summary: "Nikkei reported that Toshiba plans to invest about ¥60 billion (roughly $380 million) in its Philippine plant to double hard-drive output for AI data centers by fiscal 2027. Seagate and Western Digital shares fell sharply on concern about added supply."
    source: { name: "Yahoo Finance", url: "https://finance.yahoo.com/markets/article/seagate-western-digital-stocks-sink-as-rival-toshibas-expansion-plans-hit-storage-highfliers-142919224.html" }
    companies: [seagate, western-digital, toshiba]
    nodes: [chips/memory/hdd]
    themes: [memory-cycle]

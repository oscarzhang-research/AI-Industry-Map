    date: 2026-10-07
    title: "Nvidia and Microsoft unveil RTX Spark Windows PCs built for AI agents"
    summary: "At a Microsoft event, Jensen Huang and Satya Nadella showed RTX Spark PCs running AI agents locally on Windows; laptop preorders opened with availability from October 16, and compact desktops follow in November."
    source: { name: "NVIDIA", url: "https://blogs.nvidia.com/blog/local-ai-rtx-spark-microsoft-windows-event" }
    companies: [nvidia, microsoft]
    nodes: [applications/devices/phones-pcs, chips/edge-silicon/mobile-pc-soc]
    themes: [edge-ai, agents]

  - id: 2026-10-02-tesla-q3-energy-storage-deployments
    date: 2026-10-02
    title: "Tesla deploys 13.7 GWh of energy storage in the third quarter, below forecasts"
    summary: "Tesla deployed 13.7 GWh of energy storage in the third quarter, up from 12.5 GWh a year earlier but below the 15.9 GWh analysts expected and its 14.2 GWh record from the fourth quarter of 2025. Full results are due October 21."
    source: { name: "Tesla (SEC 8-K)", url: "https://www.sec.gov/Archives/edgar/data/0001318605/000162828026064366/exhibit991111111.htm" }

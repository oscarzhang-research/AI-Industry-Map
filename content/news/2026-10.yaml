    date: 2026-10-01
    title: "Michigan regulators approve DTE's 20-year power contracts for a Google data center"
    summary: "Michigan regulators approved, with conditions, DTE Electric's 20-year contracts to serve Google's planned 1 GW data center in Van Buren Township. Google will pay for up to 1,600 MW of new renewables and 480 MW of batteries and is billed for at least 80% of contracted demand from December 2027."
    source: { name: "Michigan Public Service Commission", url: "https://www.michigan.gov/mpsc/commission/news-releases/2026/10/01/mpsc-approves-dte-electric-google-data-center-and-contracts-protects-customers-from-project-cost" }

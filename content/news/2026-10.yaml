  - id: 2026-10-12-microsoft-maia-300
    date: 2026-10-12
    title: "Microsoft unveils Maia 300 and will use its own chips mainly for inference"
    summary: "Microsoft introduced Maia 300, its third-generation in-house AI accelerator, and said it will use Maia mainly for inference. Bloomberg reported that Microsoft plans to start installing Maia 300 in its data centers next year, eventually at multi-gigawatt scale."

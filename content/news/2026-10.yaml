  - id: 2026-10-06-google-constellation-nuclear-deal
    date: 2026-10-06
    title: "Google signs 3.6 GW nuclear deal with Constellation, including 890 MW uprates"
    summary: "Google agreed to a 20-year PPA for 890 MW of new capacity from uprates at 11 Constellation reactors in Illinois, Pennsylvania and New Jersey, backed by more than $4.3 billion of investment, plus a 15-year contract for 2,700 MW of existing PJM output. The first uprate is due online by 2028."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-06/google-constellation-near-billion-dollar-deal-for-nuclear-power" }
    companies: [constellation, alphabet]
    nodes: [energy/power-producers/ipps]
    themes: [nuclear, power-bottleneck, data-centers]
    impact: positive
    importance: 3

  - id: 2026-10-06-seagate-toshiba-tdk-head-unit
    date: 2026-10-06
    title: "Seagate and Toshiba reportedly vie for TDK's hard-drive head business"
    summary: "Bloomberg reported that Seagate and Toshiba are competing to buy TDK's hard-drive magnetic-head unit in a deal that could be worth several billion dollars; Toshiba disputed the report and TDK said no decision had been made."
    source: { name: "Blocks & Files", url: "https://www.blocksandfiles.com/disk/2026/10/06/seagate-and-toshiba-both-want-to-acquire-tdks-disk-read/write-head-business/5301393" }
    companies: [seagate, toshiba]
    nodes: [chips/memory/hdd]
    impact: mixed
    importance: 1

  - id: 2026-10-06-nanya-dram-asp-4q26
    date: 2026-10-06
    title: "Nanya's DRAM prices seen rising about 10% in fourth quarter"
    summary: "Nanya Technology's DRAM average selling price is expected to rise about 10% in the fourth quarter, TrendForce reported, with the company able to meet only around 50–60% of customer demand, according to cited investor estimates."
    source: { name: "TrendForce", url: "https://www.trendforce.com/news/2026/10/06/news-nanya-dram-asp-seen-rising-10-in-4q26-winbond-also-sees-further-price-gains-as-memory-supply-stays-tight/" }
    companies: [nanya]

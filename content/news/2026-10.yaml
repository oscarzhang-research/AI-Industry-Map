    date: 2026-10-06
    title: "Black Hills lines up about 2.7 GW of power for Google's Cheyenne data center"
    summary: "Black Hills Corp. signed agreements through 2048 to power Google's planned data center in Cheyenne, Wyoming, investing $1.8 billion in 564 MW of new gas generation from 2027 to 2029. With about 2.1 GW of third-party resources, the supply totals about 2.7 GW, with deliveries from late 2027."
    source: { name: "Black Hills Corp. (SEC 8-K)", url: "https://www.sec.gov/Archives/edgar/data/0001130464/000119312526415597/bkh-ex99_1.htm" }

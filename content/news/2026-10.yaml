    date: 2026-10-29
    title: "Intel beats on EPS but guides fourth quarter below, citing a PC slowdown"
    summary: "Intel reported third-quarter revenue of $16.5 billion, up 21% and in line with the $16.5 billion consensus, and non-GAAP EPS of $0.52 against $0.40 expected, helped by data center revenue growth. It guided fourth-quarter revenue to $15.0 billion to $16.0 billion and non-GAAP EPS to $0.25, citing near-term PC headwinds; CNBC reported the shares fell 21%."
    source: { name: "Intel", url: "https://www.intc.com/news-events/press-releases/detail/1786/intel-reports-third-quarter-2026-financial-results" }

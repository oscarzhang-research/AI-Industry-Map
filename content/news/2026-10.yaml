    summary: "ASML reported third-quarter net sales of €11.7 billion, net income of €5.0 billion and a 57.5% gross margin, and guided fourth-quarter sales of €14.2 billion to €15.2 billion. It now expects 2026 sales of €44 billion to €45 billion and said planned supply for 2027 and 2028 will not fully meet customer demand."

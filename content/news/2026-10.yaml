    summary: "Caterpillar reported third-quarter sales and revenues of $20.7 billion, up 17% and in line with the $20.7 billion consensus, and adjusted EPS of $7.20 against $7.03 expected. Power & Energy sales rose 18% to $8.8 billion and segment profit rose 31%, driven by turbines and large engines largely for data centers."

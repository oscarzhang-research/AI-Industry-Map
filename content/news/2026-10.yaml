  - id: 2026-10-07-anthropic-claude-haiku-5-5
    date: 2026-10-07
    title: "Anthropic releases Claude Haiku 5.5, its new small model"
    summary: "Anthropic released Claude Haiku 5.5, which it calls its fastest, cheapest and most capable small model yet, nine days after Claude Sonnet 5.5; it is available through Anthropic, AWS, Google Cloud and Microsoft Azure."
    source: { name: "Anthropic", url: "https://www.anthropic.com/claude-haiku-5-5" }
    companies: [anthropic]
    nodes: [models/frontier-labs/closed-frontier]

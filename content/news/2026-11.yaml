    date: 2026-11-09
    title: "Norway's grid operator pauses new data center grid reservations"
    summary: "Statnett stopped new grid capacity reservations for data centers until no later than Aug. 1, 2027, while it writes technical rules for their fast-changing loads. About 800 MW of data centers are connected, 4.2 GW reserved and 9.1 GW queued, and the government proposed a licensing regime for new sites."
    source: { name: "DCD", url: "https://www.datacenterdynamics.com/en/news/norway-halts-grid-connection-applications-for-new-data-centers/" }

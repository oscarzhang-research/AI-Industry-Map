    summary: "Anthropic made Claude Fable 5.2 generally available at $8 per million input tokens and $40 per million output tokens, down from $10 and $50, and offered Mythos 5.2, the same model with fewer safeguards, to vetted cyber and life-sciences organizations. Anthropic says the models run up to 30% faster than the 5.1 versions."

    summary: "Deutsche Telekom's T.Capital Tech Fund invested €100 million in Mistral AI's Series D round as a first step toward a partnership on sovereign AI for German businesses and public bodies. Telekom did not disclose the stake size or partnership terms."
    source: { name: "Deutsche Telekom", url: "https://www.telekom.com/en/newsroom/latest-updates/media-information/2026/11/deutsche-telekom-advances-sovereign-ai-in-germany" }

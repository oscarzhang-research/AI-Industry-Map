    title: "Infineon guides to about €20 billion of revenue in fiscal 2027"
    summary: "Infineon's fiscal fourth-quarter revenue rose 19% from a year earlier to €4.706 billion, with a segment result margin of 23.8%. EPS of €0.60 was just below the €0.62 expected. For fiscal 2027 it expects revenue of about €20 billion, more than 20% growth, with data center power supplies close to €4 billion."

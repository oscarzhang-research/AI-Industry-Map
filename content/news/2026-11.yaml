    summary: "Pony AI's third-quarter revenue rose 75% to $44.6 million, above the $39.1 million expected, and its loss of $0.11 per share was narrower than the $0.18 expected. Robotaxi revenue rose 165% to $17.8 million, the fleet reached 2,768 vehicles, and it kept its target of 3,500 vehicles in 20 cities by year-end."

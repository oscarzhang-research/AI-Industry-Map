    summary: "Google's TPU 8tx uses TPU 8t silicon with AMD EPYC hosts and hardware-level security for confidential inference, while TPU 8i Max packages two TPU 8i chips with 384 GB of HBM and 17.2 TB/s of bandwidth for long-context inference."

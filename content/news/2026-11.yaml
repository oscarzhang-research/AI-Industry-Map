month: 2026-11
items:
  - id: 2026-11-04-tencent-hy4-release
    date: 2026-11-04
    title: "Tencent releases its Hy4 model and says it will open the weights"
    summary: "Tencent released the full version of its Hy4 large language model, adding visual understanding for the first time, and said it plans to publish the weights. The August preview had 770 billion total and 49 billion active parameters; Tencent says Hy4 still trails leading closed models on research-level math, long-horizon coding and visual question answering."
    source: { name: "Tencent", url: "https://www.tencent.com/tencent-releases-and-open-sources-tencent-hy4-preview/" }
    companies: [tencent]
    nodes: [models/china-models/china-bigtech]
    themes: [china-ai]
    impact: neutral
    importance: 1

  - id: 2026-11-03-amd-q3-2026-results
    date: 2026-11-03
    title: "AMD data center revenue nearly doubles and it guides fourth quarter to $17 billion"
    summary: "AMD reported record third-quarter revenue of $13.4 billion, up 45% and above the $13.09 billion consensus, and adjusted EPS of $2.09 against $1.95 expected, with data center revenue up 97% on Instinct GPUs and EPYC CPUs. It guided fourth-quarter revenue to about $17 billion, plus or minus 3%."
    source: { name: "AMD", url: "https://ir.amd.com/news-events/press-releases/detail/1303/amd-reports-third-quarter-2026-financial-results" }
    companies: [amd]
    nodes: [chips/compute/gpus, chips/compute/server-cpus]
    themes: [inference]
    impact: positive
    importance: 3

  - id: 2026-11-03-eaton-q3-2026-results
    date: 2026-11-03
    title: "Eaton sales rise 28% and it raises 2026 EPS guidance"
    summary: "Eaton reported record third-quarter sales of $8.9 billion, up 28% with 19% organic growth and above the $8.5 billion consensus, and adjusted EPS of $3.68 against $3.55 expected. Electrical backlog rose 46%, and Eaton raised 2026 adjusted EPS guidance to $13.70 to $13.80 and agreed to buy COL Group to add European data center capacity."
    source: { name: "Eaton", url: "https://www.eaton.com/us/en-us/company/news-insights/news-releases/2026/eaton-reports-record-third-quarter-2026-results.html" }
    companies: [eaton]
    nodes: [infrastructure/power-delivery/ups-switchgear]
    themes: [data-centers]
    impact: positive
    importance: 2

  - id: 2026-11-03-shopify-q3-2026-results
    date: 2026-11-03
    title: "Shopify revenue grows 32% but sales and GMV come in just short of estimates"
    summary: "Shopify reported third-quarter revenue of $3.74 billion, up 32% and just below the $3.75 billion consensus, and adjusted EPS of $0.49 against $0.46 expected. GMV of $119.1 billion also missed estimates, Shopify guided fourth-quarter revenue growth to the low thirties, and the shares fell 8.7%."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/03/shopify-q3-2026-earnings-gmv.html" }
    companies: [shopify]
    nodes: [applications/ads-commerce-content/commerce]
    impact: negative
    importance: 2

  - id: 2026-11-03-nvidia-caps-china-business-at-cloud-clients
    date: 2026-11-03
    title: "Nvidia tells cloud clients to keep China-linked business below half, FT reports"
    summary: "Nvidia has asked data center and cloud customers to keep at least 51% of their services with companies outside China, the Financial Times reported, according to Bloomberg. The instruction reportedly applies beyond Asia; Nvidia has not commented publicly."
    source: { name: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-11-03/nvidia-tells-data-center-clients-to-trim-china-business-ft-says" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    themes: [export-controls, china-ai]
    impact: negative
    importance: 2

  - id: 2026-11-03-meta-bond-sale-20-25-billion
    date: 2026-11-03
    title: "Meta markets a $20 billion to $25 billion bond sale to fund AI spending"
    summary: "Meta sought to raise $20 billion to $25 billion in a bond sale split about two-thirds dollars and one-third euros, CNBC reported, days after S&P moved its outlook to negative. The company sold $25 billion of bonds in April."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/03/meta-bond-sale-ai-funding.html" }
    companies: [meta]
    nodes: [applications/ads-commerce-content/ads-recsys]
    themes: [capex]
    impact: neutral
    importance: 2

  - id: 2026-11-03-anthropic-queensland-lease
    date: 2026-11-03
    title: "Anthropic signs a lease for the first stage of a Queensland data center campus"
    summary: "Anthropic's Australian unit signed a lease with Australian Data Centres, a Dexus-majority consortium, for the first stage of a proposed hyperscale campus in Western Downs, Queensland, subject to approvals including Dexus's board, DCD reported. Terms were not disclosed."
    source: { name: "DCD", url: "https://www.datacenterdynamics.com/en/news/anthropic-signs-lease-with-australian-data-centres-in-western-downs-queensland/" }
    companies: [anthropic]
    nodes: [infrastructure/data-centers/ai-campuses]
    themes: [data-centers]
    impact: positive
    importance: 1

  - id: 2026-11-02-crc-bloom-1gw-fuel-cells
    date: 2026-11-02
    title: "California Resources and Bloom Energy study 1 GW of fuel cells with carbon capture"
    summary: "California Resources and Bloom Energy signed a non-binding memorandum to evaluate 1 GW or more of solid-oxide fuel cell power in California paired with carbon capture and storage. They plan to sell the power to data centers, utilities and industrial users."
    source: { name: "California Resources", url: "https://www.crc.com/news-releases/news-release-details/california-resources-corporation-announces-strategic" }
    companies: [bloom-energy]
    nodes: [energy/generation-equipment/fuel-cells]
    themes: [power-bottleneck]
    impact: positive
    importance: 1

  - id: 2026-11-02-openai-grid-protectors-program
    date: 2026-11-02
    title: "OpenAI pledges up to 1 GW of flexible demand from its data centers"
    summary: "OpenAI launched a voluntary Grid Protectors Program under which its future campuses will cut or curtail power use and join demand-response programs when the grid is stressed, offering up to 1 GW of flexible demand. Its Effingham County, Georgia, campus will be the pilot."
    source: { name: "OpenAI", url: "https://openai.com/index/grid-protectors-program/" }
    companies: [openai]
    nodes: [energy/power-producers/to-data-centers]
    themes: [power-bottleneck, data-centers]
    impact: neutral
    importance: 1

  - id: 2026-11-02-apple-fq4-2026-results
    date: 2026-11-02
    title: "Apple beats on sales and EPS but guides gross margin lower"
    summary: "Apple reported fiscal fourth-quarter revenue of $114.5 billion, up 12% and above the $113.4 billion consensus, and EPS of $2.10 against $1.99 expected, including $0.05 from tariff refunds. Mac revenue rose nearly 24% to $10.8 billion, and Apple guided December-quarter gross margin to 45% to 46%, below the 47.9% just reported."
    source: { name: "Apple", url: "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/" }
    companies: [apple]
    nodes: [applications/devices/phones-pcs]
    impact: mixed
    importance: 3

  - id: 2026-11-02-palantir-q3-2026-results
    date: 2026-11-02
    title: "Palantir revenue grows 96% as US commercial sales rise 148%"
    summary: "Palantir reported third-quarter revenue of $2.31 billion, above the $2.18 billion consensus, and adjusted EPS of $0.44 against $0.41 expected, with US commercial revenue up 148% to $984 million. It raised 2026 revenue guidance to $8.530 billion to $8.534 billion and guided fourth-quarter revenue to $2.649 billion to $2.653 billion."
    source: { name: "Palantir", url: "https://www.businesswire.com/news/home/20261101396214/en/Palantir-Reports-Q3-2026-U.S.-Comm-Revenue-Growth-of-148-YY-and-Revenue-Growth-of-96-YY-Raises-FY-2026-Revenue-Guidance-to-91-YY-Growth-and-U.S.-Comm-Revenue-Guidance-to-143-YY-Crushing-Consensus-Expectations" }
    companies: [palantir]
    nodes: [applications/enterprise/data-platforms]
    themes: [agents]
    impact: positive
    importance: 2

  - id: 2026-11-02-lumentum-fq1-2027-results
    date: 2026-11-02
    title: "Lumentum beats its EPS guidance and forecasts revenue above $1.5 billion"
    summary: "Lumentum reported fiscal first-quarter revenue of $1.26 billion and non-GAAP EPS of $4.57 against the $4.22 consensus. It guided second-quarter revenue to $1.575 billion to $1.625 billion and non-GAAP EPS to $5.90 to $6.20, on the day it agreed to combine with Marvell."
    source: { name: "Lumentum", url: "https://investor.lumentum.com/financial-news-releases/news-details/2026/Lumentum-Announces-First-Quarter-of-Fiscal-Year-2027-Financial-Results/default.aspx" }
    companies: [lumentum]
    nodes: [infrastructure/networking/optical-components]
    themes: [optical]
    impact: positive
    importance: 2

  - id: 2026-11-02-bwxt-q3-2026-results
    date: 2026-11-02
    title: "BWXT beats on EPS and tightens 2026 guidance"
    summary: "BWX Technologies reported third-quarter revenue of $953.0 million, just below the $972 million consensus, and non-GAAP EPS of $1.26 against $1.19 expected. It tightened 2026 non-GAAP EPS guidance to $4.72 to $4.77, kept revenue guidance at about $3.8 billion, and pointed to high-single-digit revenue growth in 2027."
    source: { name: "BWX Technologies", url: "https://investors.bwxt.com/news-releases/news-release-details/bwx-technologies-reports-third-quarter-2026-results" }
    companies: [bwx-technologies]
    nodes: [energy/generation-equipment/nuclear-smr]
    themes: [nuclear]
    impact: neutral
    importance: 2

  - id: 2026-11-02-tempus-ai-q3-2026-results
    date: 2026-11-02
    title: "Tempus AI turns a non-GAAP profit and raises 2026 revenue guidance"
    summary: "Tempus AI reported third-quarter revenue of $411.5 million, up 23% and slightly above the $409 million consensus, and non-GAAP EPS of $0.07 against an expected loss of $0.08. It raised 2026 revenue guidance to $1.60 billion to $1.605 billion and kept adjusted EBITDA guidance at about $65 million."
    source: { name: "Tempus AI", url: "https://www.sec.gov/Archives/edgar/data/0001717115/000119312526442619/tem-ex99_1.htm" }
    companies: [tempus-ai]
    nodes: [applications/vertical/health-bio]
    impact: positive
    importance: 2

  - id: 2026-11-02-marvell-to-acquire-lumentum
    date: 2026-11-02
    title: "Marvell agrees to buy Lumentum in an all-stock deal valued at $115 billion"
    summary: "Marvell will give 4.5 of its shares for each Lumentum share, an implied enterprise value of about $115 billion, leaving Marvell holders with about 67% of the combined company. The deal pairs Marvell's custom silicon and electrical interconnect with Lumentum's lasers and optical circuit switches, targets more than $1 billion of annual cost synergies, and is expected to close in the first half of 2028."
    source: { name: "Marvell", url: "https://investor.marvell.com/_assets/_4b2ef940d8378f4928a6a90255e70f76/marvell/news/2026-11-02_Marvell_and_Lumentum_to_Combine_Creating_a_1040.pdf" }
    companies: [marvell, lumentum]
    nodes: [chips/compute/custom-asic, infrastructure/networking/optical-components]
    themes: [optical, custom-asic]
    impact: positive
    importance: 3

  - id: 2026-11-02-anthropic-amended-s1-q3
    date: 2026-11-02
    title: "Anthropic's amended S-1 shows a $23.3 billion third-quarter loss and $895 billion of commitments"
    summary: "Anthropic's amended IPO filing reports about $17 billion of third-quarter revenue, up 47% from the second quarter, and a net loss of $23.29 billion, CNBC reported. Purchase commitments and leases total about $895.4 billion, substantially all for compute and infrastructure, up from $265.6 billion at the end of June."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/02/anthropic-ant-s-1-quarter-financials.html" }
    companies: [anthropic]
    nodes: [models/frontier-labs/closed-frontier]
    themes: [capex]
    impact: mixed
    importance: 3

  - id: 2026-11-02-openai-abu-dhabi-agreements
    date: 2026-11-02
    title: "OpenAI signs four agreements in Abu Dhabi spanning energy, government and investment"
    summary: "OpenAI agreed with ADNOC and G42 to bring its models into ADNOC's operations, with Mubadala and Inception42 on AI for investment analysis, and with Inception42 on a five-year deal covering government, enterprise and education, CNBC reported. Abu Dhabi's government also launched a project with OpenAI to make its policies and regulations machine-readable."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/02/openai-abu-dhabi-ai-deals.html" }
    companies: [openai]
    nodes: [models/frontier-labs/closed-frontier]
    themes: [sovereign-ai]
    impact: positive
    importance: 2

  - id: 2026-11-02-spacexai-two-more-southaven-campuses
    date: 2026-11-02
    title: "Musk says SpaceXAI will add two more Colossus 2 campuses in Southaven"
    summary: "Elon Musk said SpaceXAI will expand Colossus 2 to two more sites in Southaven, Mississippi, and claimed both will run by the end of the year, DCD reported. The existing Colossus 2 sites are set to host about 770,000 GPUs, and the site's gas turbines face a Clean Air Act lawsuit that a judge allowed to proceed last week."
    source: { name: "DCD", url: "https://www.datacenterdynamics.com/en/news/spacexai-launching-two-additional-data-center-campuses-in-mississippi-to-further-expand-colossus-2/" }
    companies: [xai]
    nodes: [models/frontier-labs/closed-frontier]
    themes: [data-centers, power-bottleneck]
    impact: neutral
    importance: 1

  - id: 2026-11-02-doe-transuranic-fuel-awards
    date: 2026-11-02
    title: "DOE awards up to $50 million to eight advanced reactor fuel projects including Oklo"
    summary: "The Energy Department's ARPA-E selected eight projects, including Oklo, Westinghouse, Standard Nuclear and Idaho National Laboratory, to share up to $50 million for recycled transuranic fuels for advanced reactors. Individual awards range from $1.3 million to $7 million."
    source: { name: "World Nuclear News", url: "https://www.world-nuclear-news.org/articles/next-generation-fuel-projects-get-us-federal-funding" }
    companies: [oklo]
    nodes: [energy/fuel/enrichment-fuel]
    themes: [nuclear]
    impact: positive
    importance: 1

  - id: 2026-11-02-south-korea-record-ai-budget
    date: 2026-11-02
    title: "South Korea proposes 4.7 trillion won for a sovereign frontier AI model"
    summary: "President Lee Jae Myung's proposed 2027 budget raises total spending 12.8% to a record 820.9 trillion won, including 21.3 trillion won for semiconductors, physical AI and AI data centers, nearly double 2026. It sets aside 4.7 trillion won for a sovereign model aiming for the world's highest performance, pending National Assembly approval."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/02/south-korea-ai-spending-budget.html" }
    companies: []
    nodes: [models/frontier-labs]
    themes: [sovereign-ai]
    impact: positive
    importance: 2

  - id: 2026-11-01-deepseek-super-agent-prototype
    date: 2026-11-01
    title: "DeepSeek releases an open-source prototype of a multi-agent coding system"
    summary: "DeepSeek's Harness team described a 'super agent' in which a central agent hands tasks to parallel agents that report back, and released an open-source research prototype, the South China Morning Post reported. In the team's test, one task took just under 16 minutes against more than 29 minutes with a conventional setup."
    source: { name: "South China Morning Post", url: "https://www.scmp.com/tech/article/3372884/deepseek-unveils-ai-super-agent-coding-race-openai-anthropic" }
    companies: [deepseek]
    nodes: [models/china-models/china-startups]
    themes: [coding, agents, china-ai]
    impact: neutral
    importance: 1

  - id: 2026-11-01-nvidia-rubin-shipping-specs
    date: 2026-11-01
    title: "Nvidia trims Rubin GPU memory and NVLink bandwidth in shipping specs"
    summary: "Nvidia's Vera Rubin NVL72 page now lists 19.2 TB/s of HBM4 bandwidth and 3.0 TB/s of NVLink per Rubin GPU, down from the 22 TB/s and 3.6 TB/s it announced earlier, ServeTheHome reported as production hardware arrives. Rated FP4 compute is unchanged at 50 petaflops for inference."
    source: { name: "ServeTheHome", url: "https://www.servethehome.com/nvidia-updates-rubin-gpu-specs-as-first-production-hardware-arrives/" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    themes: [hbm]
    impact: negative
    importance: 2

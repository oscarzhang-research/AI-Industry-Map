    title: "AVC posts record quarter as revenue rises 52%"
    summary: "Asia Vital Components' third-quarter revenue rose 51.8% from a year earlier to NT$59.09 billion, against NT$57.80 billion expected, and EPS of NT$29.32 beat the NT$28.10 expected. Gross margin rose to 33.86%, and the company said it remains positive on the fourth quarter and 2027."

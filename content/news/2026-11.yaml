    impact: positive
    importance: 2

  - id: 2026-11-11-quanta-q3-2026-results
    date: 2026-11-11
    title: "Quanta's third-quarter revenue more than doubles on AI servers"
    summary: "Quanta's third-quarter revenue rose 125% from a year earlier to about NT$1.12 trillion, above the NT$1.10 trillion expected, and EPS of NT$7.08 was just below the NT$7.15 expected. The company said AI server production capacity remains on track to double by the end of 2026 from a year earlier."
    source: { name: "CNA", url: "https://www.cna.com.tw/news/afe/202611110267.aspx" }

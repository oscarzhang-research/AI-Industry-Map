    title: "Google releases Gemini 4 Carbon, its strongest model"
    summary: "Google made Gemini 4 Carbon available to developers, enterprises and consumers, aimed at long-horizon agentic work, coding and cybersecurity. Google said it ranks first on CursorBench 4.0, Perplexity's WANDR and Zapier's AutomationBench at less than half the cost per task of the next best external model."

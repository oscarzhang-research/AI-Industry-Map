  - id: 2026-11-23-amazon-decart-deal
    date: 2026-11-23
    title: "Amazon agrees to acquire Decart's chip software and hire its founders"
    summary: "Amazon agreed to acquire AI startup Decart's software for running models across different chips and to hire its founders, CNBC reported; TechCrunch put the deal at about $7.5 billion. The technology could help Amazon move workloads onto its Trainium chips as it prepares to sell them more widely."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/23/amazon-decarts-ai-acquisition.html" }
    companies: [amazon]
    nodes: [chips/compute/hyperscaler-silicon]
    themes: [custom-asic, inference]
    impact: positive

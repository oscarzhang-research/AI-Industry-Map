    date: 2026-11-19
    title: "Intuit beats estimates and agrees to sell Mailchimp for $3.68 billion"
    summary: "Intuit's fiscal first-quarter revenue rose 12% to $4.35 billion, above the $4.31 billion expected, and non-GAAP EPS of $2.91 beat the $2.64 expected. It lowered full-year revenue guidance to $23.08 billion to $23.37 billion on weaker Credit Karma, kept its EPS outlook, and agreed to sell Mailchimp to Bending Spoons for about $3.68 billion."

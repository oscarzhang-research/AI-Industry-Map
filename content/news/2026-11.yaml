    summary: "Crusoe sold its unfinished southeast Wyoming data center project to Google, which plans to invest $17 billion in a campus near Cheyenne; the price was not disclosed. Crusoe had paused the site in June at its customer's request and is still building a campus for Google near Amarillo, Texas."

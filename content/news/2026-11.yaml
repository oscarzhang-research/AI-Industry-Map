  - id: 2026-11-10-opg-darlington-smr-delay
    date: 2026-11-10
    title: "Ontario's first BWRX-300 reactor will miss its 2030 date and C$7.7 billion budget"
    summary: "Ontario Power Generation said the first BWRX-300 small modular reactor at Darlington will not reach commercial operation by October 2030 or be finished within its C$7.7 billion estimate, citing first-of-a-kind engineering and supply chain pressures. It expects a revised cost and schedule by mid-2027."
    source: { name: "World Nuclear News", url: "https://www.world-nuclear-news.org/articles/opg-to-revise-timeline-and-cost-of-first-smr-unit" }

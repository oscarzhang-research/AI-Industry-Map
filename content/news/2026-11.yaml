    summary: "Samsung Electronics promoted Sang Joon Hwang to president and head of its memory business, Sangyeun Cho to president and head of System LSI, and Jong Myeong Lee to president and CTO of its Device Solutions division. Hwang previously led memory development, including DRAM and HBM."

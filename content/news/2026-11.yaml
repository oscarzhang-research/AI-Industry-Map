    title: "Microsoft plans to work with fewer neoclouds, sources tell CNBC"
    summary: "Microsoft is cutting the number of neocloud suppliers it uses and focusing on a few key partners while expanding its own data centers, CNBC reported citing sources; it has not decided which to drop. Two people said it also chose not to renew a deal with Oracle, and Microsoft said its strategy is built on flexibility and choice."

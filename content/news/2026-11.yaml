    title: "Google signs a 50 MW superhot geothermal deal with Quaise in Oregon"
    summary: "Quaise Energy agreed to sell Google 50 MW from Project Obsidian, a superhot geothermal project in central Oregon, to supply Google's data centers in The Dalles from as early as 2030. The first phase uses conventional drilling, and a later phase is to use Quaise's millimeter-wave drilling."
    source: { name: "Quaise Energy", url: "https://www.quaise.com/news/quaise-energy-signs-50-mw-geothermal-power-purchase-agreement-with-google" }

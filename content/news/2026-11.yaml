    date: 2026-11-10
    title: "IBM and Microsoft launch a joint platform for industry AI agents"
    summary: "IBM and Microsoft launched a platform for enterprises to build, run and govern AI agents for industry-specific work. IBM Consulting supplies more than 6,000 pre-built agents, and Microsoft provides the AI, cloud and security layer."
    source: { name: "IBM Newsroom", url: "https://newsroom.ibm.com/2026-11-10-ibm-and-microsoft-announce-a-new-ai-agent-platform-designed-for-industry-specific-transformation" }

    title: "Alibaba proposes a separate Hong Kong listing for chip unit T-Head"
    summary: "Alibaba told the Hong Kong exchange it proposes to spin off chip-design unit T-Head and list it on the Main Board, after a confidential filing in September. The listing still needs approval from the exchange's listing committee and a filing with China's securities regulator, and Alibaba says there is no assurance it will happen."

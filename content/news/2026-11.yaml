    summary: "Rebellions will connect its Rebel R200 NPUs to Nvidia's platform through NVLink Fusion, with Nvidia GPUs handling prefill and the NPUs handling decode, and SK Telecom will deploy the systems for public and private Korean AI services. Nvidia expects the R200 systems in 2028."

items:
  - id: 2026-11-26-nvidia-pauses-southeast-asia-shipments
    date: 2026-11-26
    title: "Nvidia tells partners to pause server shipments to four Southeast Asian countries"
    summary: "Nvidia told manufacturing partners to pause AI server shipments to Malaysia, Singapore, Thailand and Indonesia, according to reports cited by TechCrunch and DCD. The pause follows the Commerce Department's Nov. 16 rule requiring licenses for advanced chip exports to data centers in those countries, and it is unclear how long it will last."
    source: { name: "TechCrunch", url: "https://techcrunch.com/2026/11/26/nvidia-hits-pause-on-chip-shipments-to-southeast-asia/" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    themes: [export-controls]
    impact: negative
    importance: 2

  - id: 2026-11-25-huawei-convicted-us-trial
    date: 2026-11-25
    title: "US jury convicts Huawei in its fraud and trade secrets trial"
    summary: "A federal jury in Brooklyn convicted Huawei in a criminal case over bank fraud, conspiracy to steal trade secrets and related charges, CNBC reported. Prosecutors had alleged Huawei misled banks about its Iran business and evaded US sanctions; the trial ran about two months."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/25/huawei-fraud-trade-trial.html" }
    companies: [huawei]
    nodes: [chips/compute/china-accelerators]
    themes: [export-controls, china-ai]
    impact: negative
    importance: 2

  - id: 2026-11-25-sp-warns-nvidia-rating
    date: 2026-11-25
    title: "S&P warns it could cut Nvidia's credit rating over governance risk"
    summary: "S&P Global Ratings said it could lower Nvidia's credit rating, citing rising management and governance risk and reliance on a key executive after Jensen Huang's resignation and reinstatement, CNBC reported. Moody's had already cut Nvidia's outlook to stable from positive on Nov. 18."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/26/nvidia-market-governance-risk.html" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    impact: negative
    importance: 1

  - id: 2026-11-24-dell-fq3-2027-results
    date: 2026-11-24
    title: "Dell's revenue doubles to $54.9 billion as AI backlog hits $132.3 billion"
    summary: "Dell's fiscal third-quarter revenue rose 103% to $54.9 billion, above the $49.3 billion expected, and adjusted EPS of $9.45 beat the $6.59 expected. AI server revenue rose 291% to about $22 billion, AI orders were $60.2 billion and backlog reached $132.3 billion; Dell raised full-year revenue guidance to $202 billion and AI server revenue guidance to $78 billion."
    source: { name: "Dell Technologies", url: "https://investors.delltechnologies.com/news-events/press-releases/detail/1665/dell-technologies-delivers-third-quarter-fiscal-2027-financial-results" }
    companies: [dell]
    nodes: [infrastructure/servers/oem]
    themes: [capex, data-centers]
    impact: positive
    importance: 3

  - id: 2026-11-24-xiaomi-q3-2026-results
    date: 2026-11-24
    title: "Xiaomi's adjusted profit falls 57% as memory costs rise"
    summary: "Xiaomi's third-quarter revenue fell 5.2% to RMB 107.2 billion, above the RMB 105.6 billion expected, and EPS of RMB 0.19 matched the consensus. Adjusted net profit fell 56.8% to RMB 4.88 billion, which the company tied to higher memory and component costs, while EV deliveries reached 100,975."
    source: { name: "Sina Tech", url: "https://finance.sina.com.cn/tech/roll/2026-11-24/doc-inizvuzi4768407.shtml" }
    companies: [xiaomi]
    nodes: [applications/devices/phones-pcs]
    themes: [memory-cycle]
    impact: negative
    importance: 2

  - id: 2026-11-24-megaspeed-entity-list
    date: 2026-11-24
    title: "US adds Megaspeed and six other companies to its export blacklist"
    summary: "The Commerce Department added Singapore-based Megaspeed, its subsidiaries and six other companies to the Entity List over concerns about diversion of advanced computing products, CNBC reported. Megaspeed has been a major buyer of Nvidia chips."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/24/us-adds-megaspeed-to-trade-blacklist-over-export-control-concerns-.html" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    themes: [export-controls, china-ai]
    impact: negative
    importance: 2

  - id: 2026-11-24-anthropic-below-ipo-price
    date: 2026-11-24
    title: "Anthropic shares close below the $83 IPO price"
    summary: "Anthropic closed below its $83 IPO price on Nov. 24, after opening at $111.50 on its Nov. 19 debut and falling steadily since, CNBC reported. Most analysts covering the stock remain positive."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/11/24/anthropic-stock-ipo-price.html" }
    companies: [anthropic]
    nodes: [models/frontier-labs/closed-frontier]
    impact: negative
    importance: 1

  - id: 2026-11-23-nvidia-reinstates-huang
    date: 2026-11-23
    title: "Nvidia's board reinstates Jensen Huang as CEO"
    summary: "Nvidia's board voted unanimously to reinstate Jensen Huang as president, CEO and director, effective immediately, 11 days after his resignation. The board said it received input from senior US government officials and is confident his return poses no national security risk; Colette Kress returns to her role as CFO."
    source: { name: "NVIDIA (SEC 8-K)", url: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000090/0001045810-26-000090-index.htm" }
    companies: [nvidia]
    nodes: [chips/compute/gpus]
    impact: positive
    importance: 3

  - id: 2026-11-23-crowdstrike-to-acquire-zscaler
    date: 2026-11-23
    title: "CrowdStrike agrees to buy Zscaler for $43.9 billion in stock"
    summary: "CrowdStrike agreed to acquire Zscaler in an all-stock deal valuing it at about $43.9 billion, with Zscaler holders receiving 1.135 CrowdStrike shares per share. CrowdStrike holders would own about 84.1% of the combined company, and the deal needs Zscaler shareholder and regulatory approval."
    source: { name: "CrowdStrike and Zscaler (SEC)", url: "https://www.sec.gov/Archives/edgar/data/1535527/000110465926130785/tm2630454d1_ex99-1.htm" }
    companies: [crowdstrike, zscaler]
    nodes: [applications/security/security-platforms]
    themes: [agents]
    impact: mixed
    importance: 3

  - id: 2026-11-23-crowdstrike-fq3-2027-results
    date: 2026-11-23
    title: "CrowdStrike's revenue rises 28% and it posts record net new ARR"
    summary: "CrowdStrike's fiscal third-quarter revenue rose 28% to $1.58 billion, with ending ARR up 27% to $6.26 billion and record net new ARR of $419.2 million. It raised full-year revenue guidance to about $6.08 billion and full-year ARR guidance to about $6.71 billion."
    source: { name: "CrowdStrike", url: "https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-reports-third-quarter-fiscal-year-2027-financial" }
    companies: [crowdstrike]
    nodes: [applications/security/security-platforms]
    impact: positive
    importance: 2

  - id: 2026-11-23-zscaler-fq1-2027-results
    date: 2026-11-23
    title: "Zscaler's revenue rises 20% as it withdraws guidance ahead of the CrowdStrike deal"
    summary: "Zscaler's fiscal first-quarter revenue rose 20% to $949.3 million, and non-GAAP EPS of $1.23 beat the $1.16 expected. ARR grew 21% to $3.88 billion, and the company withdrew its financial guidance after agreeing to be acquired by CrowdStrike."
    source: { name: "Zscaler", url: "https://ir.zscaler.com/news-releases/news-release-details/zscaler-announces-first-quarter-fiscal-year-2027-financial" }
    companies: [zscaler]
    nodes: [applications/security/security-platforms]
    impact: positive
    importance: 2

  - id: 2026-11-23-hpe-fq4-2026-results
    date: 2026-11-23
    title: "HPE's revenue rises 50% as AI systems backlog reaches $10.5 billion"
    summary: "HPE's fiscal fourth-quarter revenue rose 50% to $14.5 billion, just above the $14.4 billion expected, and EPS of $1.43 beat the $1.29 expected. AI systems orders rose more than 130% to $4.5 billion, the AI backlog reached $10.5 billion, and HPE raised its fiscal 2027 guidance."
    source: { name: "HPE", url: "https://www.hpe.com/us/en/newsroom/press-release/2026/11/hpe-reports-fiscal-2026-fourth-quarter-results.html" }
    companies: [hpe]

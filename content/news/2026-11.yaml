    date: 2026-11-10
    title: "Fujikura's first-half operating profit rises 161% on data center demand"
    summary: "Fujikura's net sales rose 55% to ¥867.4 billion in the six months to September, and operating profit rose 161% to ¥235 billion. Quarterly EPS of ¥60.29 beat the ¥48.43 expected. It now expects full-year net sales of ¥1.768 trillion and operating profit of ¥429 billion, slightly below the ¥432 billion it guided in August."
    source: { name: "Investing.com", url: "https://www.investing.com/news/earnings/fujikura-raises-fullyear-forecast-after-1h-operating-profit-more-than-doubles-5014117" }

    title: "Anthropic sets IPO range of $70 to $78 a share"
    summary: "Anthropic plans to sell 825 million shares at $70 to $78 each and start trading on Nasdaq on Nov. 19 under the ticker ANT, CNBC reported. The top of the range would raise about $64 billion and, per TechCrunch, value the company at up to $1.404 trillion on a fully diluted basis."

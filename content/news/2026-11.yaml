    summary: "SoftBank Group, Grab and Sarawak's Petros plan $1 billion of initial seed capital for AI infrastructure in Sarawak, Malaysia: $800 million from SoftBank and $100 million each from Grab and Petros. The SoftBank-led project has a long-term target of 5 GW of AI compute, with money deployed in stages as customer contracts are signed."

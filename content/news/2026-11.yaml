  - id: 2026-11-11-google-gemini-decisions-api
    date: 2026-11-11
    title: "Google launches a Gemini API for fast yes-or-no and multiple-choice decisions"
    summary: "Google released the Gemini Decisions API, powered by a new Gemini Decision 1 model, for bounded choices such as tool selection, policy checks and model routing. It scores up to 1,000 questions against one multimodal input of up to 256,000 tokens in a single pass instead of generating text."
    source: { name: "Google", url: "https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/" }
    companies: [alphabet]
    nodes: [models/frontier-labs/closed-frontier]

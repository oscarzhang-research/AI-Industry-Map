  - id: 2026-11-22-tsmc-samsung-pause-china-shipments
    date: 2026-11-22
    title: "TSMC and Samsung hold some chip shipments to Chinese designers under the new US rule"
    summary: "TSMC and Samsung told some Chinese customers they will hold shipments of certain processors while they apply for US licenses, the Financial Times reported. The Commerce rule issued Nov. 16 stops foundries from clearing Chinese designs based on customer-supplied specifications, and shipments already in transit can proceed until Dec. 21."
    source: { name: "Tom's Hardware", url: "https://www.tomshardware.com/tech-industry/policy/tsmc-reportedly-pauses-shipments-to-chinese-designers-after-u-s-export-rules-flag-decade-old-16nm-and-14nm-nodes-new-bis-controls-threaten-smartphone-tv-and-automotive-chips" }

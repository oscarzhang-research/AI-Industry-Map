    summary: "Anthropic took over Caterpillar generator orders placed by OnePWR Solutions, about $3.4 billion of equipment rated at 1.7 GW, according to the Financial Times as reported by DCD. The generators are expected within two years, and OnePWR will handle installation at Anthropic's data centers."

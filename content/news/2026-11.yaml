    summary: "Nvidia's board said independent directors and outside counsel will review reports that Jensen Huang was the target of a foreign intelligence effort, and that it has no reason to believe national security or company secrets were compromised. Nvidia shares fell about 5% in premarket trading on November 9, CNBC reported."

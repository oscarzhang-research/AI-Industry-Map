    date: 2026-11-10
    title: "CoreWeave raises 2026 guidance as backlog reaches $132.5 billion"
    summary: "CoreWeave's third-quarter revenue rose to $3.66 billion from $1.37 billion a year earlier, and its net loss of $1.27 per share was narrower than the $1.55 expected. Backlog reached about $132.5 billion, and it raised 2026 guidance to $13.0 to $13.3 billion of revenue and $1.275 to $1.375 billion of adjusted operating income."
    source: { name: "CoreWeave", url: "https://investors.coreweave.com/news/news-details/2026/CoreWeave-Reports-Strong-Third-Quarter-2026-Results/default.aspx" }

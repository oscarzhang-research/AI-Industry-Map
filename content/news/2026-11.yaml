    summary: "Kuaishou's third-quarter revenue fell 11.1% to RMB 31.6 billion, below the RMB 35.7 billion expected, and adjusted net profit dropped 84% to RMB 790 million, though adjusted EPS of RMB 0.18 was in line with the RMB 0.17 expected. R&D spending rose 42% to RMB 5.2 billion, mainly on its Kling AI video models."

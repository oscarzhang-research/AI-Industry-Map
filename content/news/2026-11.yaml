    date: 2026-11-20
    title: "DOE again orders Constellation's Eddystone units kept available for PJM"
    summary: "The Department of Energy issued another emergency order directing PJM and Constellation Energy to keep Units 3 and 4 of the Eddystone Generating Station in Pennsylvania available to run. The units were originally due to retire on May 31, 2025."
    source: { name: "U.S. Department of Energy", url: "https://www.energy.gov/articles/energy-secretary-keeps-critical-generation-available-mid-atlantic-0" }

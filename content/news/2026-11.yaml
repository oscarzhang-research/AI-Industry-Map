  - id: 2026-11-11-siemens-energy-fq4-2026-results
    date: 2026-11-11
    title: "Siemens Energy posts record quarter and guides to 14% to 16% growth"
    summary: "Siemens Energy's fiscal fourth-quarter revenue reached a record €12.8 billion, up 21.5% on a comparable basis and above the €12.66 billion expected, while EPS of €1.32 missed the €1.38 expected. For fiscal 2027 it expects comparable revenue growth of 14% to 16%, a profit margin before special items of 14% to 16% and about €10 billion of pre-tax free cash flow, with a record €164 billion backlog."
    source: { name: "Siemens Energy", url: "https://www.siemens-energy.com/global/en/home/press-releases/earnings-release-q4-fy-2026--siemens-energy-reports-a-record-yea.html" }

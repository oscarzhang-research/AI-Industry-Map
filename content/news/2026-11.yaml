    summary: "Vistra reported third-quarter ongoing operations adjusted EBITDA of $2.38 billion, up more than 50%, and net income of $1.14 billion including a $559 million unrealized hedge gain. It narrowed 2026 adjusted EBITDA guidance to $7.1 billion to $7.5 billion, set 2027 at $7.7 billion to $8.5 billion, and added $1.5 billion to its buyback."

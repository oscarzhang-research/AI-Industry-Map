    date: 2026-11-19
    title: "Alibaba's AI cloud revenue rises 53% as earnings miss forecasts"
    summary: "Alibaba's September-quarter revenue rose 10% to RMB 271.5 billion, below the RMB 308.9 billion expected, and adjusted EPS of RMB 8.10 per ADS missed the RMB 11.03 expected. AI Cloud and Compute Services revenue rose 53% to RMB 61.0 billion, with external customer revenue up 64% and the segment's adjusted EBITA margin up to 14.5%."

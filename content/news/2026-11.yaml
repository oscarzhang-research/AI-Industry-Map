    nodes: [chips/foundry-packaging/leading-edge]
    themes: [export-controls, china-ai]
    impact: negative
    importance: 2

  - id: 2026-11-22-openai-perplexity-metric
    date: 2026-11-22
    title: "OpenAI publishes its pretraining perplexity data and proposes it as a shared metric"
    summary: "OpenAI chief scientist Jakub Pachocki published the company's internal pretraining perplexity measurements and proposed perplexity, or cross-entropy loss, as a common metric for comparing model developers. He said it could help set shared safety standards across the industry."
    source: { name: "OpenAI", url: "https://openai.com/index/perplexity-and-intelligence" }
    companies: [openai]
    nodes: [models/frontier-labs/closed-frontier]

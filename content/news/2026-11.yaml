  - id: 2026-11-23-openai-cisco-shirudo
    date: 2026-11-23
    title: "OpenAI and Cisco release Shirudo, an open-source runtime to shield unpatched Linux systems"
    summary: "OpenAI and Cisco launched Shirudo, an open-source runtime that lets operators deploy temporary shields against a vulnerability on running Linux systems before a patch lands. In a test, a Codex-generated shield blocked an exploit against a live Elasticsearch service without a restart."
    source: { name: "OpenAI", url: "https://openai.com/index/introducing-shirudo" }
    companies: [openai, cisco]
    nodes: [models/frontier-labs/closed-frontier]
    themes: [agents]
    impact: neutral
    importance: 1

  - id: 2026-11-23-ferc-approves-miso-queue-plan
    date: 2026-11-23
    title: "FERC approves MISO's plan to speed its interconnection studies"
    summary: "FERC approved rule changes from the Midcontinent Independent System Operator to speed studies of projects in its legacy interconnection queue. MISO said its queue cycles, totaling about 125 GW of generation and storage, would otherwise have been delayed."
    source: { name: "Utility Dive", url: "https://www.utilitydive.com/news/ferc-miso-interconnection-queue-study/875449/" }
    companies: []
    nodes: [energy/grid/grid-epc]

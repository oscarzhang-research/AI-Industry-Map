    date: 2026-11-09
    title: "NRC issues construction permit for Dow and X-energy's Texas SMR plant"
    summary: "The NRC issued a construction permit for the Long Mott Generating Station, four 80 MWe Xe-100 reactors at Dow's Seadrift, Texas site, the first for a high-temperature gas-cooled reactor in the US in nearly 60 years. Dow said the permit is not a final investment decision and expects to consider a preliminary one in 2027."
    source: { name: "Dow", url: "https://corporate.dow.com/en-us/news/press-releases/dows-long-mott-generating-station-receives-nrc-construction-permit.html" }

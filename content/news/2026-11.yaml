    title: "Tesla's China retail sales fall 66% to the lowest since 2022"
    summary: "Tesla sold an estimated 8,817 cars in China in October, down 66% from a year earlier and the lowest since July 2022, based on CPCA data. Exports from Shanghai reached 59,012, about 87% of its 67,829 wholesale shipments."

    date: 2026-11-10
    title: "SoftBank Group swings to a $7 billion quarterly loss"
    summary: "SoftBank Group posted a net loss of about ¥1.1 trillion (about $7 billion) for July to September, its first quarterly loss in two years, or ¥196.54 per share against an expected profit of ¥10.18. A $3.7 billion charge tied to advance payments for US data center power equipment, including an Ohio project, was the largest drag."

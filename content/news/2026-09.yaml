    themes: [memory-cycle]
    impact: positive
    importance: 2

  - id: 2026-09-30-amazon-constellation-calvert-cliffs
    date: 2026-09-30
    title: "Amazon signs 20-year deal for 690 MW of Calvert Cliffs nuclear power"
    summary: "Constellation and Amazon signed a 20-year power purchase agreement for 690 MW from Maryland's Calvert Cliffs plant, including about 190 MW of uprates due between 2030 and 2032, supporting more than $3 billion of investment and a planned relicensing effort."
    source: { name: "Constellation", url: "https://www.constellationenergy.com/news/2026/09/constellation-and-amazon-announce-20-year-power-purchase-agreement-at-calvert-cliffs.html" }
    companies: [constellation, amazon]
    nodes: [energy/power-producers/ipps]
    themes: [nuclear, power-bottleneck]
    impact: positive
    importance: 2

  - id: 2026-09-30-hpe-vultr-amd-helios-order
    date: 2026-09-30
    title: "HPE wins $1.2 billion Vultr order, its first for AMD Helios racks"
    summary: "Hewlett Packard Enterprise said Vultr placed a $1.2 billion order for AMD Helios AI rack systems for its US data centers, HPE's first Helios order; each rack pairs 72 AMD Instinct MI455X GPUs with EPYC 'Venice' CPUs."
    source: { name: "Fierce Network", url: "https://www.fierce-network.com/broadband/hpe-lands-first-amd-helios-order-12b-vultr-deal" }
    companies: [hpe, amd]

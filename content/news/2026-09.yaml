  - id: 2026-09-29-samsung-1-billion-helix
    date: 2026-09-29
    title: "Samsung group to invest $1 billion in KKR-launched AI infrastructure firm Helix"
    summary: "Samsung Electronics will invest $500 million, with five other Samsung affiliates supplying the rest of a $1 billion commitment, in Helix, a KKR-launched AI infrastructure company whose founding investors include the Kuwait Investment Authority, Nvidia and Vistra."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/09/29/samsung-investment-nvidia-kkr-ai-helix-digital.html" }
    companies: [samsung-electronics, nvidia, vistra]

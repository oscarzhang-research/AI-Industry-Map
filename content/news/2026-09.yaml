  - id: 2026-09-28-amd-to-acquire-world-labs
    date: 2026-09-28
    title: "AMD agrees to buy Fei-Fei Li's World Labs for $8.2 billion in stock"
    summary: "AMD agreed to acquire World Labs, which builds spatial-intelligence models that generate interactive 3D environments, in an all-stock deal valued at about $8.2 billion and expected to close by the end of 2026; co-founder and CEO Fei-Fei Li will become AMD's chief scientist."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/09/28/amd-fei-fei-li-world-labs.html" }
    companies: [amd, world-labs]
    nodes: [chips/compute/gpus, models/multimodal/world-models]
    impact: mixed
    importance: 3

  - id: 2026-09-28-nvidia-150-billion-buyback
    date: 2026-09-28
    title: "Nvidia adds record $150 billion to buyback, lifting authorization to $235 billion"
    summary: "Nvidia's board approved an additional $150 billion of share repurchases, which the company called the largest such increase in history, bringing its remaining authorization to $235 billion to be executed through fiscal 2028."
    source: { name: "NVIDIA", url: "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-a-150-Billion-Share-Repurchase-Authorization-Increase/default.aspx" }

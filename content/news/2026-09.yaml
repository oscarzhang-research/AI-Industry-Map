    themes: [data-centers]
    impact: positive
    importance: 2

  - id: 2026-09-30-spacexai-grok-x-subscription-plan
    date: 2026-09-30
    title: "SpaceXAI weighs folding Grok and X into one subscription, free to $100"
    summary: "SpaceXAI is weighing a plan to combine Grok and X into a single subscription with four price tiers ranging from free to $100 a month, Bloomberg reported; the plan is still under consideration."
    source: { name: "The Next Web", url: "https://thenextweb.com/news/spacexai-grok-x-subscription-tiers-ultra-lite" }
    companies: [xai]
    nodes: [applications/assistants/chat-assistants]

  - id: 2026-09-29-openai-seeks-30-billion-1-4-trillion
    date: 2026-09-29
    title: "OpenAI seeks at least $30 billion at about $1.4 trillion valuation"
    summary: "OpenAI is in early talks to raise at least $30 billion at a pre-money valuation of about $1.4 trillion, Bloomberg reported, after closing a $122 billion round at an $852 billion post-money valuation in March."
    source: { name: "CNBC", url: "https://www.cnbc.com/video/2026/09/29/openai-seeks-to-raise-30-billion-in-new-funding-round-at-1-point-4-trillion-valuation.html" }

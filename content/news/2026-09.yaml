  - id: 2026-09-28-anthropic-claude-sonnet-5-5
    date: 2026-09-28
    title: "Anthropic launches Claude Sonnet 5.5, faster at unchanged pricing"
    summary: "Anthropic released Claude Sonnet 5.5, saying output is more than 30% faster than Sonnet 5 and cost per task falls by up to 30% through fewer tokens and tool calls, while prices stay at $2 and $10 per million input and output tokens."
    source: { name: "Anthropic", url: "https://www.anthropic.com/claude-sonnet-5-5" }

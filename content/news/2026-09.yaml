  - id: 2026-09-29-openai-dots-always-on-agents
    date: 2026-09-29
    title: "OpenAI launches Dots, always-on ChatGPT agents with their own cloud computers"
    summary: "At DevDay, OpenAI introduced Dots, always-on agents powered by GPT-6 Astra that each work from a dedicated cloud computer and connect to more than 4,000 apps; they are rolling out to ChatGPT Pro and Business Premium subscribers."
    source: { name: "SiliconANGLE", url: "https://siliconangle.com/2026/09/29/openai-launches-dots-always-on-ai-agents-in-chatgpt-with-their-own-cloud-computers/" }

  - id: 2026-09-29-openai-devday-gpt-6-1-sol
    date: 2026-09-29
    title: "OpenAI unveils GPT-6.1 Sol and Ultrafast speed tier at DevDay"
    summary: "At DevDay in San Francisco, OpenAI launched GPT-6.1 Sol, which it says offers near-GPT-6 Astra intelligence at one-fifth of Astra's token prices, and an Ultrafast tier for GPT-6 Astra priced at six times standard API rates."
    source: { name: "Business Standard", url: "https://www.business-standard.com/amp/technology/tech-news/openai-devday-2026-dots-gpt-6-1-sol-codex-developer-tools-126093000396_1.html" }

  - id: 2026-09-30-micron-fq4-fy26-results
    date: 2026-09-30
    title: "Micron posts record $54.2 billion quarter, guides to about $61.5 billion"
    summary: "Micron's fiscal fourth-quarter revenue hit a record $54.23 billion, up from $11.32 billion a year earlier, with adjusted EPS of $33.42. It guided fiscal first-quarter 2027 revenue to about $61.5 billion, plus or minus $1.5 billion."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/09/30/micron-mu-q4-earnings-report-2026.html" }
    companies: [micron]
    nodes: [chips/memory/dram-hbm]
    themes: [hbm, memory-cycle]
    impact: positive
    importance: 3

  - id: 2026-09-30-trendforce-4q26-memory-contract-prices
    date: 2026-09-30
    title: "TrendForce sees Q4 DRAM contract prices up 10–15%, NAND up 15–20%"
    summary: "TrendForce projects conventional DRAM contract prices to rise 10–15% quarter on quarter in 4Q26 and NAND Flash 15–20%, as AI server demand keeps server DRAM undersupplied, though the pace of increases is moderating."
    source: { name: "TrendForce", url: "https://www.trendforce.com/presscenter/news/20260930-13258.html" }
    companies: [sk-hynix, samsung-electronics, micron, sandisk]

  - id: 2026-09-27-china-weighs-nvidia-rtx-pro-5500
    date: 2026-09-27
    title: "China weighs letting ByteDance and Alibaba buy Nvidia RTX PRO 5500 chips"
    summary: "Beijing has signaled it could let some domestic companies such as ByteDance and Alibaba buy Nvidia's RTX PRO 5500 chips, The Information reported; Nvidia said US firms remain restricted by outdated US export controls and China's own import limits."
    source: { name: "CNBC", url: "https://www.cnbc.com/2026/09/27/china-bytedance-alibaba-nvidia-chips.html" }
    companies: [nvidia, bytedance, alibaba]

name: Market data

# Scheduled runs only fire on the default branch (main). The push trigger lets a feature branch
# refresh its own snapshot when the company universe or the fetcher changes.
on:
  schedule:
    - cron: "35 21 * * 1-5" # after the US close: 5:35pm EDT / 4:35pm EST
    - cron: "30 10 * * 1-5" # after Asia closes: 6:30am EDT / 5:30am EST (Asia-Pacific listings only)
  workflow_dispatch:
    inputs:
      markets:
        description: Which listings to refresh
        type: choice
        options: [all, asia]
        default: all
  push:
    branches: ["claude/**"]
    paths:
      - "content/companies/**"
      - "content/benchmarks.yaml"
      - "scripts/prices/**"
      - "data/.refresh"

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/prices/requirements.txt
      - run: pip install -r scripts/prices/requirements.txt
      - name: Fetch prices, fundamentals and FX
        env:
          INPUT_MARKETS: ${{ github.event.inputs.markets }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MARKETS="${INPUT_MARKETS:-all}"
          if [ "$SCHEDULE" = "30 10 * * 1-5" ]; then MARKETS=asia; fi
          python scripts/prices/fetch_prices.py --markets "$MARKETS"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: market update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

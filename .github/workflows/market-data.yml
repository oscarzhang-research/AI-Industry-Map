name: Market data

# Scheduled runs only fire on the default branch (main). GitHub starts them late when its queue is busy
# (five to nine hours in October 2026), so each market gets an off-peak slot plus backups; a run that
# finds nothing new commits nothing. The push trigger covers two more cases: a feature branch refreshing
# its own snapshot when the universe or the fetcher changes, and the morning routine's news commit on
# main, which arrives on time every day and refreshes all markets before the New York morning.
on:
  schedule:
    - cron: "41 21 * * 1-5" # after the US close: 5:41pm EDT / 4:41pm EST
    - cron: "17 23 * * 1-5" # backup
    - cron: "11 2 * * 2-6" # late backup, still hours before the New York morning
    - cron: "13 9 * * 1-5" # after Asia closes (Asia-Pacific listings only)
    - cron: "37 10 * * 1-5" # backup before the morning routine (Asia-Pacific listings only)
  workflow_dispatch:
    inputs:
      markets:
        description: Which listings to refresh
        type: choice
        options: [all, asia]
        default: all
  push:
    branches: ["claude/**", "main"]
    paths:
      - "content/companies/**"
      - "content/benchmarks.yaml"
      - "scripts/prices/**"
      - "content/kpis.yaml"
      - "data/.refresh"
      - "content/news/**"

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch tip, not the commit that triggered the run: a run queued behind another one
      # then starts from the data that run committed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/prices/requirements.txt
      - run: pip install -r scripts/prices/requirements.txt
      - name: Fetch prices, fundamentals and FX
        env:
          INPUT_MARKETS: ${{ github.event.inputs.markets }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MARKETS="${INPUT_MARKETS:-all}"
          case "$SCHEDULE" in "13 9 * * 1-5" | "37 10 * * 1-5") MARKETS=asia ;; esac
          echo "MARKETS=$MARKETS" >> "$GITHUB_ENV"
          python scripts/prices/fetch_prices.py --markets "$MARKETS"
      # SEC quarterly revenue/capex and Taiwan monthly revenue into data/kpis/, on full runs only.
      # Filings change at most daily, so the SEC part runs once every 20 hours. A failure here never
      # blocks the price commit.
      - name: Fetch industry indicators
        if: env.MARKETS == 'all'
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/prices/fetch_kpis.py --sec-every-hours 20
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: market update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Each run downloads the full history, so on a conflict in data/ this run's files win.
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

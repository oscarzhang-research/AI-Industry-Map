name: Market data

# Scheduled runs only fire on the default branch (main). The push trigger lets a feature branch
# refresh its own snapshot when the company universe or the fetcher changes.
on:
  schedule:
    - cron: "35 21 * * 1-5" # after the US close: 5:35pm EDT / 4:35pm EST
    - cron: "30 10 * * 1-5" # after Asia closes: 6:30am EDT / 5:30am EST (Asia-Pacific listings only)
  workflow_dispatch:
    inputs:
      markets:
        description: Which listings to refresh
        type: choice
        options: [all, asia]
        default: all
  push:
    branches: ["claude/**"]
    paths:
      - "content/companies/**"
      - "content/benchmarks.yaml"
      - "scripts/prices/**"
      - "data/.refresh"

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch tip, not the commit that triggered the run: a run queued behind another one
      # then starts from the data that run committed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/prices/requirements.txt
      - run: pip install -r scripts/prices/requirements.txt
      - name: Fetch prices, fundamentals and FX
        env:
          INPUT_MARKETS: ${{ github.event.inputs.markets }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MARKETS="${INPUT_MARKETS:-all}"
          if [ "$SCHEDULE" = "30 10 * * 1-5" ]; then MARKETS=asia; fi
          python scripts/prices/fetch_prices.py --markets "$MARKETS"
      # SEC quarterly revenue/capex and Taiwan monthly revenue into data/kpis/. Same MARKETS rule as
      # above: skipped on the Asia-only run. A failure here never blocks the price commit.
      - name: Fetch industry indicators
        if: ${{ github.event.schedule != '30 10 * * 1-5' && (github.event.inputs.markets || 'all') == 'all' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/prices/fetch_kpis.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: market update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Each run downloads the full history, so on a conflict in data/ this run's files win.
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

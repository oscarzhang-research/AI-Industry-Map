# Temporary diagnostics for two data gaps; removed before anything is merged to main.
# 1. Yahoo returns a single row for the CSI 300 and STAR 50 indices in the batch download.
# 2. NextEra and Dominion capex is missing from the SEC company facts the KPI fetcher reads.
name: Diagnostics (temporary)

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diag-tmp.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/prices/requirements.txt

      - name: Yahoo history for the Shanghai indices
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import yfinance as yf
          from curl_cffi import requests as cr

          syms = ["000300.SS", "000688.SS", "000001.SS", "510300.SS", "588000.SS", "688256.SS"]

          def span(df):
              df = df.dropna(subset=["Close"]) if df is not None and len(df) else df
              if df is None or not len(df):
                  return "0 rows"
              return f"{len(df)} rows {df.index.min().date()}..{df.index.max().date()}"

          print("== batch download, as the fetcher does it")
          df = yf.download(tickers=syms + ["AAPL", "0700.HK"], start="2022-10-01", interval="1d", auto_adjust=False,
                           actions=True, group_by="ticker", threads=True, progress=False, multi_level_index=True)
          for s in syms:
              try:
                  print(f"  {s:10} {span(df[s])}")
              except Exception as exc:
                  print(f"  {s:10} error {exc}")

          print("== single-symbol download")
          for s in syms[:3]:
              d = yf.download(s, start="2022-10-01", interval="1d", auto_adjust=False, actions=True, progress=False,
                              multi_level_index=False)
              print(f"  {s:10} {span(d)}")

          print("== Ticker.history")
          for s in syms[:2]:
              t = yf.Ticker(s)
              for kw in ({"start": "2022-10-01"}, {"period": "max"}, {"period": "1y"}, {"period": "1mo"}):
                  try:
                      print(f"  {s:10} {kw} {span(t.history(auto_adjust=False, **kw))}")
                  except Exception as exc:
                      print(f"  {s:10} {kw} error {exc}")

          print("== raw chart API")
          for s in syms[:3]:
              for q in ("range=1mo&interval=1d", "period1=1664582400&period2=1792000000&interval=1d"):
                  url = f"https://query2.finance.yahoo.com/v8/finance/chart/{s}?{q}"
                  try:
                      r = cr.get(url, impersonate="chrome", timeout=30)
                      res = (r.json().get("chart", {}).get("result") or [{}])[0]
                      meta = res.get("meta", {})
                      ts = res.get("timestamp") or []
                      closes = ((res.get("indicators", {}).get("quote") or [{}])[0].get("close")) or []
                      keep = {k: meta.get(k) for k in ("symbol", "exchangeName", "instrumentType", "firstTradeDate",
                                                       "dataGranularity", "range", "validRanges", "timezone")}
                      print(f"  {s:10} {q[:12]} http {r.status_code} timestamps {len(ts)} closes {sum(c is not None for c in closes)} {json.dumps(keep)}")
                      if r.status_code != 200 or not ts:
                          print("    body:", r.text[:300])
                  except Exception as exc:
                      print(f"  {s:10} {q[:12]} error {exc}")
          PY

      - name: SEC capex concepts for NextEra and Dominion
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          UA = os.environ["SEC_USER_AGENT"]
          rx = re.compile(r"capital|expenditure|additions|construction|PaymentsToAcquire|PaymentsFor|Investments?In", re.I)
          for sym in ("NEE", "D", "DUK"):
              cik = json.load(open(f"data/kpis/sec/{sym}.json"))["cik"]
              req = urllib.request.Request(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json", headers={"User-Agent": UA})
              doc = json.load(urllib.request.urlopen(req, timeout=60))
              facts = doc.get("facts", {})
              print(f"== {sym} {doc.get('entityName')} taxonomies: { {t: len(c) for t, c in facts.items()} }")
              for tax, concepts in facts.items():
                  for name, c in concepts.items():
                      if not rx.search(name):
                          continue
                      vals = [v for u in c.get("units", {}).values() for v in u if v.get("end", "") >= "2025-01-01" and v.get("form") in ("10-Q", "10-K")]
                      if not vals:
                          continue
                      vals.sort(key=lambda v: (v["end"], v.get("start", "")))
                      last = vals[-3:]
                      shown = "; ".join(f"{v.get('start', '')}..{v['end']} {v['val'] / 1e9:.2f}B {v.get('form')} {v.get('frame', '')}" for v in last)
                      print(f"  {tax}:{name} ({c.get('label')}) n={len(vals)} | {shown}")
          PY

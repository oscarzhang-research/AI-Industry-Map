# Temporary diagnostics for two data gaps; removed before anything is merged to main.
# Yahoo has no daily history for 000300.SS and 000688.SS: check other symbols for the same indices.
name: Diagnostics (temporary)

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diag-tmp.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/prices/requirements.txt

      - name: Yahoo symbols for the CSI 300 and STAR 50
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from curl_cffi import requests as cr

          syms = ["399300.SZ", "000300.SS", "000688.SS", "510300.SS", "588000.SS", "399006.SZ"]
          for s in syms:
              url = f"https://query2.finance.yahoo.com/v8/finance/chart/{s}?period1=1664582400&period2=1792000000&interval=1d"
              try:
                  r = cr.get(url, impersonate="chrome", timeout=30)
                  res = (r.json().get("chart", {}).get("result") or [{}])[0]
                  meta = res.get("meta", {})
                  ts = res.get("timestamp") or []
                  closes = ((res.get("indicators", {}).get("quote") or [{}])[0].get("close")) or []
                  day = lambda t: datetime.fromtimestamp(t, timezone.utc).strftime("%Y-%m-%d")
                  rng = f"{day(ts[0])}..{day(ts[-1])}" if ts else "-"
                  last = next((c for c in reversed(closes) if c is not None), None)
                  print(f"{s:10} http {r.status_code} days {len(ts):4} {rng} last close {last} | {meta.get('instrumentType')} "
                        f"{meta.get('exchangeName')} {meta.get('currency')} | {meta.get('longName')!r} / {meta.get('shortName')!r} | ranges {meta.get('validRanges')}")
              except Exception as exc:
                  print(f"{s:10} error {exc}")
          PY

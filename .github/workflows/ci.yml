name: CI

# Content validation, type checks, unit tests and a production build for every branch push.
# Data-only commits from the market-data job are skipped.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "data/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The fetchers' offline tests (standard library and PyYAML only); the news tests also check
      # content/news-sources.yaml against the company ids.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python -m unittest discover -s scripts/news -p 'test_*.py'
      - run: python -m unittest discover -s scripts/prices -p 'test_fetch_kpis.py'
